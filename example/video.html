<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#f5f7fb;font-family:system-ui,sans-serif}
#app{width:100vw;height:100vh;background:radial-gradient(circle at 50% 30%,#20283b,#090b10 55%,#040507)}
.panel{position:absolute;inset:7%;border:1px solid #ffffff22;border-radius:28px;background:#0c0f16ee;overflow:hidden}
.top{height:70px;border-bottom:1px solid #ffffff18;display:flex;align-items:center;padding:0 28px;gap:18px}.dot{width:12px;height:12px;border-radius:50%;background:#65d6ff}.brand{font-weight:800}.url{margin-left:auto;color:#8992a7;font-size:14px}
.content{position:absolute;top:70px;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;padding:40px}.hero{text-align:center;max-width:850px}.kicker{font-size:16px;letter-spacing:.18em;color:#75d7ff;text-transform:uppercase;font-weight:800}
h1{font-size:70px;line-height:.95;margin:18px 0;letter-spacing:-.05em}.sub{font-size:22px;color:#b5bdcd;line-height:1.45}.badge{display:inline-flex;margin-top:30px;padding:10px 16px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff20;font-weight:700}
.demo{display:none;width:100%;height:100%;align-items:center;justify-content:center}.card{width:88%;height:76%;border-radius:24px;background:#111722;border:1px solid #ffffff1d;position:relative;overflow:hidden}.title{position:absolute;top:24px;left:28px;font-size:20px;font-weight:800;z-index:2}.tag{position:absolute;top:24px;right:24px;padding:8px 12px;border-radius:10px;background:#173020;color:#7df2a4;font-weight:800}.claim{position:absolute;bottom:24px;left:24px;color:#aab3c4}
.scene{position:absolute;inset:0;background:linear-gradient(160deg,#15273b,#071019 65%,#040608)}.castle{position:absolute;left:13%;bottom:16%;width:55%;height:45%;background:linear-gradient(#8a93a6,#3b4250);clip-path:polygon(0 100%,8% 35%,28% 35%,35% 8%,48% 35%,75% 35%,84% 48%,100% 100%)}.wizard{position:absolute;left:40%;bottom:17%;width:80px;height:160px;background:#d8b48b;border-radius:45px 45px 20px 20px;box-shadow:0 -55px 0 -12px #3e6cff}.map{position:absolute;inset:15%;background:repeating-linear-gradient(25deg,#16291c 0 18px,#1e3622 18px 21px);border-radius:16px}.map:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#ff4f67;left:58%;top:42%;box-shadow:0 0 0 8px #ff4f6722}.sim{position:absolute;inset:0;background:linear-gradient(#5f8db0 0 48%,#3c6b3a 48%)}.plane{position:absolute;left:35%;top:42%;width:220px;height:70px;background:#d7dce5;clip-path:polygon(0 55%,55% 45%,100% 55%,55% 65%)}
</style></head><body><div id="app"><div class="panel"><div class="top"><div class="dot"></div><div class="brand">AI DEMO INVESTIGATION</div><div class="url" id="url">research capture</div></div><div class="content"><div class="hero" id="hero"><div class="kicker">REALITY CHECK</div><h1>Are these<br>Gemini 4 demos real?</h1><div class="sub">We traced the demos back to their sources instead of recreating them.</div><div class="badge">SOURCE → CAPTURE → VERIFY</div></div><div class="demo" id="demo"><div class="card"><div class="title" id="title"></div><div id="scene"></div><div class="tag" id="tag"></div><div class="claim" id="claim"></div></div></div></div></div></div>
<script>
window.SPMOTION={width:1080,height:1920,fps:30,duration:60};
const hero=document.getElementById('hero'),demo=document.getElementById('demo'),scene=document.getElementById('scene'),title=document.getElementById('title'),tag=document.getElementById('tag'),claim=document.getElementById('claim'),url=document.getElementById('url');
function d(kind,t,s,c,u){hero.style.display='none';demo.style.display='flex';title.textContent=t;tag.textContent=s;claim.textContent=c;url.textContent=u;scene.className='scene '+kind;scene.innerHTML=kind==='castle'?'<div class="castle"></div><div class="wizard"></div>':kind==='map'?'<div class="map"></div>':'<div class="sim"><div class="plane"></div></div>'}
window.SPMOTION_RENDER=t=>{if(t<5){hero.style.display='block';demo.style.display='none';return}if(t<13)d('castle','Chromancers Game','VERIFIED','Official Google DeepMind showcase','deepmind.google/models/gemini');else if(t<22)d('map','DOS Google Maps','VERIFIED','Official Google DeepMind showcase','deepmind.google/models/gemini');else if(t<36)d('sim','Gemini 4 Pro — reported demo','UNVERIFIED','Attribution from testers / reports','atoms.mgx.dev/blog/gemini-4-pro-examples');else if(t<50)d('sim','The important distinction','REAL DEMO ≠ VERIFIED MODEL','A demo can exist without proving which model made it','source attribution matters');else{hero.style.display='block';demo.style.display='none';hero.querySelector('.kicker').textContent='THE TAKEAWAY';hero.querySelector('h1').innerHTML='Verify the<br>model, not just the demo.';hero.querySelector('.sub').textContent='The next test is to trace every claim back to its primary source.';hero.querySelector('.badge').textContent='FULL BREAKDOWN → LONG VIDEO'}};window.SPMOTION_RENDER(0);
</script></body></html>
