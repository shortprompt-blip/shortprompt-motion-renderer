<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>How to Turn YouTube Viewers Into Subscribers</title>
<style>
:root{--bg:#080b12;--panel:#111827;--panel2:#172033;--line:#2b3548;--text:#f4f7fb;--muted:#9ba8bc;--red:#ff3348;--cyan:#4bd7e8;--green:#69e6ad;--yellow:#ffc96b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 80% 10%,#19243a 0,transparent 40%),linear-gradient(135deg,#080b12,#0d1320 65%,#090d15)}.top{position:absolute;left:86px;right:86px;top:54px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:22px;letter-spacing:2px;text-transform:uppercase}.brand{color:#fff;font-weight:800;letter-spacing:1px}.brand b{color:var(--red)}.progress{position:absolute;top:104px;left:86px;right:86px;height:5px;background:#202b3c;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--red)}.content{position:absolute;left:100px;right:100px;top:155px;bottom:100px;display:flex;flex-direction:column;justify-content:center;opacity:1;transition:none}.eyebrow{font-size:22px;color:var(--cyan);letter-spacing:4px;text-transform:uppercase;font-weight:800;margin-bottom:22px}.headline{font-size:70px;line-height:1.03;font-weight:850;letter-spacing:-2px;max-width:1500px;margin:0 0 26px}.sub{font-size:29px;line-height:1.35;color:var(--muted);max-width:1320px}.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}.panel{background:linear-gradient(150deg,rgba(25,35,53,.96),rgba(14,21,34,.96));border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 70px #0003}.panel h3{margin:0 0 22px;font-size:25px;color:#dbe4f2}.metric{display:flex;align-items:baseline;gap:18px;margin:8px 0 20px}.metric strong{font-size:62px;letter-spacing:-2px}.metric span{font-size:22px;color:var(--muted)}.bars{display:flex;flex-direction:column;gap:17px;margin-top:22px}.barrow{display:grid;grid-template-columns:250px 1fr 120px;align-items:center;gap:18px;font-size:22px}.track{height:24px;background:#263146;border-radius:6px;overflow:hidden}.fill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--cyan),#4385f5);transform-origin:left}.barrow:nth-child(2) .fill{background:linear-gradient(90deg,#6fe3b0,#26a77e)}.barrow:nth-child(3) .fill{background:linear-gradient(90deg,#ffc96b,#ff8b51)}.barrow:nth-child(4) .fill{background:linear-gradient(90deg,#b3a1ff,#826bff)}.value{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.pill{display:inline-flex;padding:9px 15px;border:1px solid #39465d;border-radius:99px;color:#d4deee;font-size:18px;margin:5px 8px 0 0}.ui{border:1px solid #344055;border-radius:20px;background:#f8fafc;color:#172033;overflow:hidden;margin-top:30px;box-shadow:0 20px 70px #0005}.uihead{height:64px;background:#fff;border-bottom:1px solid #dfe5ed;display:flex;align-items:center;padding:0 24px;gap:16px;font-size:19px;font-weight:800}.ytmark{width:34px;height:24px;background:#ff3348;border-radius:7px;display:inline-block;position:relative}.ytmark:after{content:'';position:absolute;left:13px;top:6px;border-left:10px solid white;border-top:6px solid transparent;border-bottom:6px solid transparent}.uibody{display:grid;grid-template-columns:230px 1fr;min-height:320px}.side{padding:24px;background:#f1f4f8;border-right:1px solid #dfe5ed;font-size:18px;color:#526077;line-height:2.35}.side .active{color:#172033;font-weight:800;background:#dce5f0;border-radius:8px;padding:4px 10px}.mainui{padding:26px}.tabs{display:flex;gap:24px;border-bottom:1px solid #dfe5ed;padding-bottom:15px;color:#59677c;font-size:17px}.tabs .sel{color:#172033;font-weight:800;border-bottom:3px solid #172033;padding-bottom:13px;margin-bottom:-16px}.uicards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.uicard{border:1px solid #dfe5ed;border-radius:12px;padding:18px;background:#fff}.uicard small{display:block;color:#64748b;font-size:15px;margin-bottom:10px}.uicard strong{font-size:31px}.uicard em{display:block;color:#0c9c70;font-size:14px;font-style:normal;margin-top:8px}.callout{border-left:5px solid var(--red);padding:20px 24px;background:#151d2b;border-radius:0 12px 12px 0;font-size:27px;line-height:1.35;margin-top:25px;max-width:1350px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:35px}.step{padding:26px;border:1px solid var(--line);background:#111827;border-radius:18px;min-height:170px}.step b{font-size:21px;color:var(--cyan);display:block;margin-bottom:14px}.step span{font-size:23px;line-height:1.25}.footer{position:absolute;bottom:38px;left:88px;right:88px;display:flex;justify-content:space-between;color:#7e8ba0;font-size:17px;letter-spacing:1px}.number{color:#d5deeb;font-variant-numeric:tabular-nums}.fade{animation:fade .5s ease}@keyframes fade{from{opacity:.15;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.smallnote{color:#8d9bb1;font-size:18px;margin-top:18px}.bigstat{display:flex;align-items:center;gap:30px;margin-top:32px}.circle{width:210px;height:210px;border-radius:50%;border:18px solid #263349;border-top-color:var(--cyan);border-right-color:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center}.circle strong{font-size:42px}.circle span{font-size:16px;color:var(--muted)}.end{font-size:24px;color:#e1e8f3;line-height:1.6}.end strong{color:var(--cyan)}
</style></head><body><main class="stage" id="stage"><div class="top"><div class="brand"><b>▶</b> CREATOR GROWTH FIXES</div><div>YOUTUBE STUDIO · AUDIENCE</div></div><div class="progress"><span id="prog"></span></div><section class="content" id="content"></section><div class="footer"><span>ILLUSTRATIVE ANALYTICS · RECONSTRUCTED UI</span><span class="number" id="clock">00:00 / 07:00</span></div></main>
<script>
const W=1920,H=1080,D=420;
const scenes=[
{at:0,k:'THE PROBLEM',title:'VIEWS… BUT NO SUBSCRIBERS?',sub:'Find the gap between one useful video and a viewer who wants to come back.',kind:'hook'},
{at:30,k:'STEP 01 · AUDIENCE',title:'Start with audience behavior',sub:'Use trends, not just the total subscriber count.',kind:'audience'},
{at:78,k:'STEP 02 · DIAGNOSE',title:'New viewers up. Returning viewers flat?',sub:'Attention is growing — but the next-video connection may be missing.',kind:'segments'},
{at:126,k:'STEP 03 · COMPARE CONTENT',title:'Which videos actually gain subscribers?',sub:'A view count alone does not tell you which upload builds your audience.',kind:'videos'},
{at:176,k:'STEP 04 · CHANNEL PROMISE',title:'Make the reason to return obvious',sub:'A clear channel promise helps the right viewers recognize future value.',kind:'promise'},
{at:224,k:'STEP 05 · CTA',title:'Ask after you deliver value',sub:'Connect the invitation to a specific next problem you solve.',kind:'cta'},
{at:268,k:'STEP 06 · END SCREENS',title:'Connect one useful video to the next',sub:'Use the final 5–20 seconds to recommend a relevant next step.',kind:'endscreen'},
{at:315,k:'STEP 07 · MEASURE',title:'Compare results fairly',sub:'Use the same time window and treat every metric as a clue.',kind:'measure'},
{at:365,k:'THE REPEATABLE SYSTEM',title:'Build a viewer-to-subscriber loop',sub:'Attract the right viewer → deliver value → recommend the next useful video.',kind:'plan'},
{at:400,k:'YOUR NEXT ACTION',title:'Make the next step easy to see',sub:'The goal is not every viewer. It is the right viewer who wants more.',kind:'end'}
];
function bars(rows){return `<div class="bars">${rows.map((r,i)=>`<div class="barrow"><span>${r[0]}</span><div class="track"><div class="fill" style="width:${r[1]}%"></div></div><span class="value">${r[2]}</span></div>`).join('')}</div>`}
function ui(){return `<div class="ui"><div class="uihead"><i class="ytmark"></i> YouTube Studio <span style="margin-left:auto;color:#66758a;font-weight:500">Channel analytics · Example</span></div><div class="uibody"><div class="side">Dashboard<br>Content<br><span class="active">Analytics</span><br>Community<br>Subtitles</div><div class="mainui"><div class="tabs"><span>Overview</span><span class="sel">Audience</span><span>Content</span><span>Research</span></div><div class="uicards"><div class="uicard"><small>Monthly audience</small><strong>18.4K</strong><em>Illustrative value</em></div><div class="uicard"><small>New viewers</small><strong>12.1K</strong><em>Example segment</em></div><div class="uicard"><small>Returning viewers</small><strong>3.7K</strong><em>Example segment</em></div></div><div style="margin-top:20px;color:#64748b;font-size:16px">Reconstructed interface — not live channel data</div></div></div></div>`}
function renderScene(s,t){let body='';if(s.kind==='hook')body=`<div class="eyebrow">${s.k}</div><h1 class="headline">${s.title}</h1><p class="sub">${s.sub}</p><div class="split"><div class="panel"><h3>VIDEO A · REACH</h3><div class="metric"><strong>42.8K</strong><span>views</span></div>${bars([['Views',95,'42.8K'],['Subscribers',18,'77']])}</div><div class="panel"><h3>VIDEO B · AUDIENCE FIT</h3><div class="metric"><strong>18.2K</strong><span>views</span></div>${bars([['Views',42,'18.2K'],['Subscribers',42,'164']])}</div></div><div class="smallnote">Illustrative numbers only — not a universal benchmark.</div>`;
if(s.kind==='audience')body=`<div class="eyebrow">${s.k}</div><h1 class="headline">${s.title}</h1><p class="sub">${s.sub}</p>${ui()}<div class="callout">Monthly audience can be more useful than subscriber count for understanding how many people are actively watching.</div>`;
if(s.kind==='segments')body=`<div class="eyebrow">${s.k}</div><h1 class="headline">${s.title}</h1><p class="sub">${s.sub}</p><div class="split"><div class="panel"><h3>ILLUSTRATIVE AUDIENCE TREND</h3>${bars([['New viewers',90,'↑ 48%'],['Casual viewers',37,'↑ 4%'],['Regular viewers',22,'— 1%']])}<div class="smallnote">Example trend, not a real report.</div></div><div class="panel"><h3>WHAT TO INVESTIGATE</h3><div class="steps" style="grid-template-columns:1fr 1fr"><div class="step"><b>01</b><span>Is the next video obvious?</span></div><div class="step"><b>02</b><span>Does the channel promise match?</span></div></div><div class="callout">A flat returning-viewer trend is a clue to investigate, not proof that content is bad.</div></div></div>`;
if(s.kind==='videos')body=`<div class="eyebrow">${s.k}</div><h1 class="headline">${s.title}</h1><p class="sub">${s.sub}</p><div class="panel" style="margin-top:34px"><h3>COMPARE SIMILAR VIDEOS · SAME TIME WINDOW</h3>${bars([['Thumbnail CTR fix',82,'164 subs'],['Retention tutorial',57,'113 subs'],['General trend recap',35,'69 subs'],['Unrelated upload',20,'39 subs']])}<div class="smallnote">Fictional sample used to demonstrate comparison — not a performance benchmark.</div></div><div class="callout">Compare subscriber gains alongside views, format, topic, traffic source and video age.</div>`;
if(s.kind==='promise')body=`<div class="eyebrow">${s.k}</div><h1 class="headline">${s.title}</h1><p class="sub">${s.sub}</p><div class="split"><div class="panel"><h3>VAGUE PROMISE</h3><div class="headline" style="font-size:40px;margin-top:28px">“Subscribe for more videos.”</div><p class="sub" style="font-size:22px">The viewer cannot tell what future value to expect.</p></div><div class="panel" style="border-color:#3a7d80"><h3>SPECIFIC PROMISE</h3><div class="headline" style="font-size:40px;margin-top:28px">“Practical YouTube growth fixes.”</div><p class="sub" style="font-size:22px">The audience, topic and expected benefit are clearer.</p></div></div><div class="smallnote">Example copy. Use only a promise your future uploads consistently deliver.</div>`;
if(s.kind==='cta')body=`<div class="eyebrow">${s.k}</div><h1 class="headline">${s.title}</h1><p class="sub">${s.sub}</p><div class="panel" style="margin-top:35px"><div class="steps" style="grid-template-columns:repeat(3,1fr)"><div class="step"><b>FIRST</b><span>Deliver the answer the viewer came for.</span></div><div class="step"><b>THEN</b><span>Show the next problem your channel solves.</span></div><div class="step"><b>INVITE</b><span>Ask viewers who want that help to subscribe.</span></div></div></div><div class="callout">A relevant reason to return is more informative than repeating “subscribe” several times.</div>`;
if(s.kind==='endscreen')body=`<div class="eyebrow">${s.k}</div><h1 class="headline">${s.title}</h1><p class="sub">${s.sub}</p><div class="split"><div class="panel"><h3>LAST 5–20 SECONDS</h3><div style="display:flex;gap:14px;align-items:center;margin-top:28px"><div style="width:310px;height:174px;border:2px solid #53647d;border-radius:10px;background:linear-gradient(135deg,#25334b,#111827);display:flex;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px">CURRENT VIDEO<br>KEY TAKEAWAY</div><div style="display:flex;flex-direction:column;gap:12px"><div style="width:210px;height:78px;border:2px solid var(--cyan);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--cyan);font-size:18px">NEXT VIDEO</div><div style="width:210px;height:60px;border:2px solid var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:18px">SUBSCRIBE</div></div></div><div class="smallnote">Schematic end screen, not a YouTube screenshot.</div></div><div class="panel"><h3>CHOOSE THE NEXT STEP</h3><div class="steps" style="grid-template-columns:1fr"><div class="step"><b>CTR → RETENTION</b><span>Continue the diagnostic journey.</span></div><div class="step"><b>RETENTION → IMPRESSIONS</b><span>Answer the next natural question.</span></div></div><div class="smallnote">YouTube end screens support videos/playlists and a subscribe element on eligible videos.</div></div></div>`;
if(s.kind==='measure')body=`<div class="eyebrow">${s.k}</div><h1 class="headline">${s.title}</h1><p class="sub">${s.sub}</p><div class="split"><div class="panel"><h3>VIDEO A</h3><div class="metric"><strong>42,800</strong><span>views</span></div><div class="metric"><strong>77</strong><span>subs gained</span></div><div class="pill">0.18% illustrative rate</div></div><div class="panel"><h3>VIDEO B</h3><div class="metric"><strong>18,200</strong><span>views</span></div><div class="metric"><strong>164</strong><span>subs gained</span></div><div class="pill">0.90% illustrative rate</div></div></div><div class="callout">Simple comparison: subscribers gained ÷ views × 100. Use your own data and the same time window; this is not an official universal benchmark.</div>`;
if(s.kind==='plan')body=`<div class="eyebrow">${s.k}</div><h1 class="headline">${s.title}</h1><p class="sub">${s.sub}</p><div class="steps"><div class="step"><b>01 · ATTRACT</b><span>Answer a clear, searchable problem.</span></div><div class="step"><b>02 · DELIVER</b><span>Give the viewer the promised result.</span></div><div class="step"><b>03 · CONNECT</b><span>Recommend the next relevant video.</span></div><div class="step"><b>04 · MEASURE</b><span>Compare subscriber gains and returns.</span></div></div><div class="panel" style="margin-top:28px"><h3>THE LOOP</h3>${bars([['Clear promise',100,'START'],['Useful next video',80,'CONNECT'],['Consistent series',65,'RETURN'],['Measure and improve',50,'REPEAT']])}</div>`;
if(s.kind==='end')body=`<div class="eyebrow">${s.k}</div><h1 class="headline" style="font-size:82px">${s.title}</h1><p class="sub" style="font-size:34px">${s.sub}</p><div class="panel" style="margin-top:42px;max-width:1350px"><div class="end"><strong>Audit two videos.</strong> Find the next useful answer. Connect them with an end screen. Compare the result fairly.<br><br><strong>Follow for more YouTube growth fixes.</strong></div></div>`;
document.getElementById('content').innerHTML=`<div class="fade">${body}</div>`}
function SPMOTION_FRAME(time){const t=Math.max(0,Math.min(D,time));let s=scenes[0];for(const x of scenes){if(t>=x.at)s=x;else break}if(window.__lastScene!==s.kind){renderScene(s,t);window.__lastScene=s.kind}document.getElementById('prog').style.width=(t/D*100)+'%';const mm=String(Math.floor(t/60)).padStart(2,'0'),ss=String(Math.floor(t%60)).padStart(2,'0');document.getElementById('clock').textContent=`${mm}:${ss} / 07:00`;return true}
window.SPMOTION={width:1920,height:1080,fps:30,duration:D};window.SPMOTION_FRAME=SPMOTION_FRAME;window.SPMOTION_RENDER=SPMOTION_FRAME;renderScene(scenes[0],0);let last=0;function preview(){if(!window.__SPMOTION_EXPORT){const t=(performance.now()/1000)%D;SPMOTION_FRAME(t)}requestAnimationFrame(preview)}requestAnimationFrame(preview);
</script></body></html>
