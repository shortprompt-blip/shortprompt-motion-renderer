<head>

<title>How to Use ChatGPT — ShortPrompt</title>
<style>
#sp-chatgpt-guide{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;box-sizing:border-box;background:#070b14;color:#f5f7fc;font-family:Arial,Helvetica,sans-serif;isolation:isolate}
#sp-chatgpt-guide *{box-sizing:border-box}
#sp-chatgpt-guide .bg{position:absolute;inset:0;background:radial-gradient(ellipse at 82% 13%,#28265d 0,transparent 35%),radial-gradient(ellipse at 12% 88%,#123c50 0,transparent 35%),linear-gradient(135deg,#080d18,#0d1324 58%,#090d18)}
#sp-chatgpt-guide .grid{position:absolute;inset:0;opacity:.055;background-image:linear-gradient(#b8c8ff 1px,transparent 1px),linear-gradient(90deg,#b8c8ff 1px,transparent 1px);background-size:48px 48px}
#sp-chatgpt-guide .top{position:absolute;left:72px;right:72px;top:42px;height:54px;display:flex;align-items:center;justify-content:space-between;z-index:3}
#sp-chatgpt-guide .brand{font-size:21px;letter-spacing:.08em;font-weight:950}.brand .short{color:#f5f7fc}.brand .brandprompt{color:#8e9cff}
#sp-chatgpt-guide .brandmark{display:inline-block;width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,#58d5ff,#a28cff);margin-right:14px;box-shadow:0 0 18px #8b91ff88}
#sp-chatgpt-guide .series{font-size:13px;letter-spacing:.16em;color:#a8b2ca;border:1px solid #3c4564;border-radius:30px;padding:11px 18px;font-weight:800}
#sp-chatgpt-guide .main{position:absolute;left:72px;right:72px;top:128px;bottom:98px;display:flex;flex-direction:column;gap:18px;z-index:2}
#sp-chatgpt-guide .eyebrow{height:22px;color:#8fa3ff;font-size:14px;letter-spacing:.19em;font-weight:900}
#sp-chatgpt-guide h1{margin:0;font-size:55px;line-height:1.04;letter-spacing:-.045em;font-weight:950;max-width:1600px}
#sp-chatgpt-guide h1 em{font-style:normal;color:#91a0ff}
#sp-chatgpt-guide .sub{font-size:22px;color:#bdc6dc;line-height:1.35;min-height:31px;max-width:1500px}
#sp-chatgpt-guide .stage{flex:1;min-height:0;border:1px solid #3b4568;border-radius:24px;overflow:hidden;background:linear-gradient(145deg,#151c31,#0d1424 75%);box-shadow:0 24px 70px #0008;position:relative}
#sp-chatgpt-guide .stagebar{height:54px;border-bottom:1px solid #ffffff18;display:flex;align-items:center;justify-content:space-between;padding:0 25px;color:#c2cbe0;font-size:12px;letter-spacing:.14em;font-weight:900}
#sp-chatgpt-guide .stagebar .mode{color:#aeb9d7;font-size:11px;border:1px solid #424d70;border-radius:20px;padding:7px 12px}
#sp-chatgpt-guide .stagebody{height:calc(100% - 54px);padding:28px 34px;position:relative}
#sp-chatgpt-guide .foot{position:absolute;left:72px;right:72px;bottom:34px;display:flex;align-items:center;justify-content:space-between;color:#7885a4;font-size:11px;letter-spacing:.15em;font-weight:800;z-index:3}
#sp-chatgpt-guide .progress{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,#55d8f5,#9b8bff);width:0;z-index:5}

#sp-chatgpt-guide .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;height:100%}
#sp-chatgpt-guide .panel{border:1px solid #394665;background:#0b1220;border-radius:18px;padding:25px;min-width:0}
#sp-chatgpt-guide .panel-label{font-size:12px;letter-spacing:.16em;color:#9aa8c9;font-weight:900;margin-bottom:17px}
#sp-chatgpt-guide .prompt{background:#151e33;border:1px solid #455174;border-radius:13px;padding:19px 21px;font-size:21px;line-height:1.45;color:#edf0ff}
#sp-chatgpt-guide .muted{color:#9ba8c5}.accent{color:#9caaff}.good{color:#80e0bf}.warn{color:#ffb48d}
#sp-chatgpt-guide .arrow{display:flex;align-items:center;justify-content:center;color:#9baaff;font-size:42px;font-weight:900}
#sp-chatgpt-guide .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
#sp-chatgpt-guide .chip{font-size:12px;letter-spacing:.07em;color:#c5ceea;border:1px solid #465276;border-radius:9px;padding:9px 12px;background:#131d33}
#sp-chatgpt-guide .cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;height:100%}
#sp-chatgpt-guide .stepcard{background:#101a2c;border:1px solid #455174;border-radius:17px;padding:23px;display:flex;flex-direction:column;justify-content:space-between}
#sp-chatgpt-guide .num{font-size:13px;color:#9baaff;letter-spacing:.15em;font-weight:900}.stepcard strong{font-size:30px;line-height:1.05}.stepcard p{font-size:18px;color:#b5c0d9;line-height:1.4;margin:0}
#sp-chatgpt-guide .chat{display:flex;flex-direction:column;gap:15px;height:100%}
#sp-chatgpt-guide .bubble{max-width:78%;padding:18px 22px;border-radius:16px;font-size:19px;line-height:1.42}
#sp-chatgpt-guide .user{align-self:flex-end;background:#263158;border:1px solid #53618e}.assistant{align-self:flex-start;background:#101a2a;border:1px solid #3b4b67}
#sp-chatgpt-guide .bubble small{display:block;color:#aab7da;font-size:10px;letter-spacing:.15em;font-weight:900;margin-bottom:8px}
#sp-chatgpt-guide .resultbox{background:#0d1727;border:1px solid #3e4c6d;border-radius:15px;padding:21px;font-size:19px;line-height:1.5;color:#e4e9f8}
#sp-chatgpt-guide .resultbox h3{margin:0 0 12px;font-size:21px;color:#fff}
#sp-chatgpt-guide .split{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:100%}
#sp-chatgpt-guide .before{border-color:#654c56}.after{border-color:#3d6a68}
#sp-chatgpt-guide .tag{font-size:11px;letter-spacing:.15em;font-weight:900;margin-bottom:14px;color:#ffb2a9}.after .tag{color:#8ce0c7}
#sp-chatgpt-guide .bodycopy{font-size:20px;line-height:1.5;color:#d6deef}
#sp-chatgpt-guide .quiz{display:flex;gap:12px;margin-top:17px}.quiz span{border:1px solid #48557a;background:#151e33;border-radius:10px;padding:12px 17px;font-size:15px;color:#d5ddf5}
#sp-chatgpt-guide .days{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;height:100%}
#sp-chatgpt-guide .day{border:1px solid #425071;border-radius:15px;background:#101a2c;padding:16px;display:flex;flex-direction:column;gap:16px}
#sp-chatgpt-guide .day b{color:#9daaff;font-size:13px;letter-spacing:.1em}.day strong{font-size:18px;line-height:1.25}.day small{font-size:13px;color:#9facc8;line-height:1.35}
#sp-chatgpt-guide .search-layout{display:grid;grid-template-columns:1.1fr 1.4fr;gap:22px;height:100%}
#sp-chatgpt-guide .source-list{display:flex;flex-direction:column;gap:12px}.source-card{background:#101a2b;border:1px solid #435173;border-radius:13px;padding:16px 18px}.source-card strong{font-size:18px;display:block}.source-card small{font-size:12px;color:#9caaca;display:block;margin-top:7px}.source-card em{font-style:normal;color:#8ce0c7;font-size:11px;letter-spacing:.1em}
#sp-chatgpt-guide .file-row{display:flex;align-items:center;gap:16px;padding:18px;border:1px solid #465477;background:#141f34;border-radius:13px;margin-bottom:17px}.fileicon{width:48px;height:58px;border-radius:8px;background:#2d3b60;display:grid;place-items:center;font-size:13px;font-weight:900;color:#cbd4ff}.file-row strong{font-size:20px}.file-row small{display:block;color:#9eabc9;margin-top:6px;font-size:13px}
#sp-chatgpt-guide .table{width:100%;border-collapse:collapse;font-size:16px}.table th,.table td{padding:14px 13px;text-align:left;border-bottom:1px solid #303c58}.table th{color:#9fadd0;font-size:11px;letter-spacing:.12em}.table td{color:#e0e6f6}
#sp-chatgpt-guide .bar-chart{height:215px;display:flex;align-items:flex-end;gap:18px;padding:15px 25px 0;border-bottom:1px solid #63708f}.bar{flex:1;background:linear-gradient(180deg,#9c91ff,#4c9ac7);border-radius:8px 8px 0 0;min-width:25px}.bar-labels{display:flex;justify-content:space-around;color:#9caaca;font-size:12px;margin-top:10px}
#sp-chatgpt-guide .feedback{display:grid;grid-template-columns:1fr 1fr;gap:22px;height:100%}.feedback .panel{display:flex;flex-direction:column;gap:18px}.feedback .bigquote{font-size:23px;line-height:1.45;color:#e7ebfa}.feedback .badge{font-size:11px;letter-spacing:.13em;color:#9daaff;font-weight:900}
#sp-chatgpt-guide .limits{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;height:100%}.limit{border:1px solid #4a526f;border-radius:16px;padding:24px;background:#10192a}.limit strong{font-size:23px;display:block;margin:15px 0}.limit p{font-size:17px;line-height:1.45;color:#b7c2da;margin:0}.limit .symbol{font-size:27px;color:#ffbd9c}
#sp-chatgpt-guide .end{display:flex;align-items:center;justify-content:space-between;height:100%;gap:50px;padding:20px 45px}.end-brand{font-size:64px;font-weight:950;letter-spacing:-.06em}.end-brand span{color:#9aa1ff}.end-copy{max-width:790px}.end-copy h2{font-size:42px;line-height:1.05;margin:0 0 16px}.end-copy p{font-size:22px;line-height:1.45;color:#bac5dd;margin:0}.next-card{border:1px solid #626c99;background:linear-gradient(145deg,#202a49,#111b30);border-radius:18px;padding:25px 30px;min-width:420px}.next-card small{color:#9daaff;letter-spacing:.15em;font-size:11px;font-weight:900}.next-card strong{display:block;font-size:29px;margin-top:12px;line-height:1.15}.next-card p{font-size:15px;color:#b8c4df;margin-top:12px}
</style>
</head>
<body>
<div id="sp-chatgpt-guide">
 <div class="bg"></div><div class="grid"></div>
 <div class="top"><div class="brand"><i class="brandmark"></i><span class="short">SHORT</span><span class="brandprompt">PROMPT</span></div><div class="series">AI TOOLS • PRACTICAL GUIDE</div></div>
 <main class="main"><div class="eyebrow" id="eyebrow"></div><h1 id="headline"></h1><div class="sub" id="sub"></div><section class="stage"><div class="stagebar"><span id="stage-title"></span><span class="mode">ILLUSTRATIVE UI RECONSTRUCTION</span></div><div class="stagebody" id="stagebody"></div></section></main>
 <div class="foot"><span>SHORTPROMPT • PRACTICAL AI, CLEARLY EXPLAINED</span><span id="scene-no"></span></div><div class="progress" id="progress"></div>
</div>
<script>
const D=355.65;
const S=[
{id:"hook",a:0,b:28.70,k:"START HERE",h:"Stop asking vague questions.<br><em>Start getting useful answers.</em>",sub:"A simple method, seven practical examples, and the next step to get more from ChatGPT.",title:"THE SAME TOOL • TWO VERY DIFFERENT RESULTS",body:`<div class="cols"><div class="panel reveal"><div class="panel-label">VAGUE REQUEST</div><div class="prompt">Write an email.</div><div class="chips"><span class="chip">No audience</span><span class="chip">No tone</span><span class="chip">No goal</span></div><p class="muted" style="font-size:18px;margin-top:28px">The model has to guess what you mean.</p></div><div class="panel reveal"><div class="panel-label">CLEAR REQUEST</div><div class="prompt">Write a polite email to a supplier asking for an update on a delayed delivery. Keep it under 120 words, use a friendly professional tone, and ask for a new delivery date.</div><div class="chips"><span class="chip">Task</span><span class="chip">Context</span><span class="chip">Constraints</span><span class="chip">Output</span></div><p class="good" style="font-size:18px;margin-top:22px">Less guessing. More useful direction.</p></div></div>`},
{id:"framework",a:28.70,b:58.26,k:"THE SIMPLE METHOD",h:"Four parts make a<br><em>stronger prompt.</em>",sub:"Use this practical framework whenever you start a new task.",title:"TASK + CONTEXT + CONSTRAINTS + OUTPUT",body:`<div class="cards4"><div class="stepcard reveal"><span class="num">01 / TASK</span><strong>What do you need?</strong><p>Write, explain, compare, plan, analyze.</p></div><div class="stepcard reveal"><span class="num">02 / CONTEXT</span><strong>What should it know?</strong><p>Audience, situation, background, goal.</p></div><div class="stepcard reveal"><span class="num">03 / CONSTRAINTS</span><strong>What are the limits?</strong><p>Tone, length, deadline, budget, rules.</p></div><div class="stepcard reveal"><span class="num">04 / OUTPUT</span><strong>What should it return?</strong><p>Checklist, table, email, steps, summary.</p></div></div>`},
{id:"email",a:58.26,b:93.91,k:"EXAMPLE 01 / WRITING",h:"Draft a better<br><em>professional email.</em>",sub:"Give ChatGPT the recipient, the situation, the tone, and the result you need.",title:"FROM A SHORT BRIEF TO A REVIEWABLE DRAFT",body:`<div class="chat"><div class="bubble user reveal"><small>YOUR PROMPT</small>Write a polite email to a supplier asking for an update on a delayed delivery. Under 120 words. Friendly but professional. Ask for a new delivery date.</div><div class="bubble assistant reveal"><small>CHATGPT • DRAFT</small><div class="resultbox"><h3>Subject: Update on delayed delivery</h3>Hello, I’m following up on the delivery that was expected this week. Could you please share its current status and confirm the revised delivery date? Thank you for your help. Best regards, [Your Name]</div></div><div class="chips reveal"><span class="chip">Review names and dates</span><span class="chip">Edit before sending</span></div></div>`},
{id:"rewrite",a:93.91,b:119.57,k:"EXAMPLE 02 / REWRITING",h:"Improve your text<br><em>without losing your voice.</em>",sub:"Ask for clarity and structure, not a completely different message.",title:"PRESERVE THE MEANING • IMPROVE THE WRITING",body:`<div class="split"><div class="panel before reveal"><div class="tag">BEFORE / ORIGINAL</div><div class="bodycopy">“I am writing because the thing we talked about has not happened yet and I wanted to ask if there is any news.”</div><div class="chips"><span class="chip">Long</span><span class="chip">Vague</span></div></div><div class="panel after reveal"><div class="tag">AFTER / REVISED</div><div class="bodycopy">“I’m following up on our previous discussion. Do you have an update on the next steps?”</div><div class="chips"><span class="chip">Clear</span><span class="chip">Concise</span><span class="chip">Same meaning</span></div></div></div>`},
{id:"learn",a:119.57,b:148.26,k:"EXAMPLE 03 / LEARNING",h:"Turn ChatGPT into<br><em>a patient tutor.</em>",sub:"Specify your level, ask for an everyday example, then test what you understood.",title:"EXPLAIN • SHOW AN EXAMPLE • CHECK UNDERSTANDING",body:`<div class="cols"><div class="panel reveal"><div class="panel-label">YOUR PROMPT</div><div class="prompt">Explain compound interest to a beginner using a simple everyday example. Then give me three questions to check whether I understood.</div><div class="chips"><span class="chip">Beginner level</span><span class="chip">Everyday example</span></div></div><div class="panel reveal"><div class="panel-label">ILLUSTRATIVE RESPONSE</div><div class="resultbox"><h3>Interest can earn interest.</h3>Imagine your savings grow by 5%. Next time, the growth is calculated on the original amount plus the interest already added.<div class="quiz"><span>1. What grows?</span><span>2. Why does it compound?</span><span>3. Give an example</span></div></div></div></div>`},
{id:"plan",a:148.26,b:177.83,k:"EXAMPLE 04 / PLANNING",h:"Turn a goal into<br><em>a realistic plan.</em>",sub:"Give it your deadline, available time, and constraints. Then refine the schedule.",title:"A SEVEN-DAY STUDY PLAN • ILLUSTRATIVE EXAMPLE",body:`<div class="days">${["Choose topic","Learn basics","Practice","Review notes","Solve tasks","Test yourself","Review"].map((x,i)=>`<div class="day reveal"><b>DAY 0${i+1}</b><strong>${x}</strong><small>${i===0?"Set one clear goal":i===6?"Check progress":"30 minutes • one focused action"}</small></div>`).join("")}</div>`},
{id:"search",a:177.83,b:206.52,k:"EXAMPLE 05 / CURRENT RESEARCH",h:"Need recent information?<br><em>Use Search and verify it.</em>",sub:"When available, ChatGPT Search can find current web information and show source links.",title:"SEARCH RESULTS ARE A STARTING POINT, NOT PROOF",body:`<div class="search-layout"><div class="panel reveal"><div class="panel-label">YOUR SEARCH REQUEST</div><div class="prompt">Find recent official guidance about [your topic]. Prioritize primary sources, include publication dates, and summarize what changed.</div><div class="chips"><span class="chip">Current information</span><span class="chip">Primary sources</span></div></div><div class="source-list"><div class="source-card reveal"><em>OFFICIAL SOURCE • EXAMPLE</em><strong>Publisher documentation</strong><small>Open the source and confirm the claim.</small></div><div class="source-card reveal"><em>DATE CHECK</em><strong>Publication / update date</strong><small>Make sure the information is still current.</small></div><div class="source-card reveal"><em>FACT CHECK</em><strong>Claim matched to evidence</strong><small>Do not assume a citation proves every sentence.</small></div></div></div>`},
{id:"mid_cta",a:206.52,b:216.09,k:"A QUICK REMINDER",h:"Want more practical<br><em>AI guides?</em>",sub:"Subscribe to ShortPrompt. Next episode: ten ready-to-copy prompts.",title:"NEXT: TEN CHATGPT PROMPTS",body:`<div class="end"><div class="end-copy"><div class="end-brand">SHORT<span>PROMPT</span></div><h2>Practical AI guides,<br>without the fluff.</h2><p>Subscribe now. The next episode gives you ten prompts you can copy and use.</p></div><div class="next-card reveal"><small>UP NEXT</small><strong>10 CHATGPT<br>PROMPTS</strong><p>Everyday work • learning • productivity</p></div></div>`},
{id:"document",a:216.09,b:243.04,k:"EXAMPLE 06 / DOCUMENTS",h:"Ask questions about<br><em>your own documents.</em>",sub:"Attach a supported file and ask for specific information you can check against the original.",title:"DOCUMENT SUMMARY • ILLUSTRATIVE RECONSTRUCTION",body:`<div class="cols"><div class="panel reveal"><div class="panel-label">ATTACHED FILE</div><div class="file-row"><div class="fileicon">PDF</div><div><strong>contract.pdf</strong><small>Example attachment • not a real contract</small></div></div><div class="prompt">Summarize this document in plain language. List the deadlines and payment terms, and cite the page or section for each point.</div></div><div class="panel reveal"><div class="panel-label">STRUCTURED OUTPUT</div><table class="table"><tr><th>ITEM</th><th>EXTRACTED DETAIL</th><th>CHECK</th></tr><tr><td>Deadline</td><td>Section reference</td><td class="good">Review source</td></tr><tr><td>Payment</td><td>Term summary</td><td class="good">Review source</td></tr><tr><td>Obligation</td><td>Plain-language note</td><td class="good">Review source</td></tr></table><p class="muted" style="font-size:14px;margin-top:18px">Always verify important clauses in the original document.</p></div></div>`},
{id:"spreadsheet",a:243.04,b:266.52,k:"EXAMPLE 07 / DATA ANALYSIS",h:"Make a spreadsheet<br><em>easier to understand.</em>",sub:"Ask a precise question, then review the chart, calculations, and assumptions.",title:"MONTHLY REVENUE • FICTIONAL SAMPLE DATA",body:`<div class="cols"><div class="panel reveal"><div class="panel-label">YOUR PROMPT</div><div class="prompt">Compare monthly revenue in this file, identify the three largest changes, and create a chart. Explain any assumptions.</div><div class="chips"><span class="chip">CSV / XLSX</span><span class="chip">Clear columns</span><span class="chip">One row per record</span></div></div><div class="panel reveal"><div class="panel-label">ILLUSTRATIVE CHART • NOT REAL BUSINESS DATA</div><div class="bar-chart">${[36,52,44,64,79,90].map(v=>`<div class="bar" style="height:${v}%"></div>`).join("")}</div><div class="bar-labels"><span>JAN</span><span>FEB</span><span>MAR</span><span>APR</span><span>MAY</span><span>JUN</span></div><p class="muted" style="font-size:14px;margin-top:18px">Sample values only. Check the source data before making decisions.</p></div></div>`},
{id:"iterate",a:266.52,b:296.96,k:"THE SKILL THAT CHANGES EVERYTHING",h:"Do not stop at the<br><em>first answer.</em>",sub:"Give feedback. Ask for a revision. Keep the context in the same conversation.",title:"A GOOD CONVERSATION IS AN ITERATION LOOP",body:`<div class="feedback"><div class="panel reveal"><div class="badge">FIRST ANSWER</div><div class="bigquote">“Here is a detailed explanation with several technical terms…”</div><div class="chips"><span class="chip">Too long</span><span class="chip">Too technical</span></div></div><div class="panel reveal"><div class="badge">YOUR FOLLOW-UP</div><div class="prompt">Make it 50% shorter. Use simpler language, keep the key facts, and give me one practical example.</div><div class="resultbox">A clearer answer, adjusted to the task and the audience.</div></div></div>`},
{id:"limits",a:296.96,b:324.78,k:"USE IT RESPONSIBLY",h:"Useful does not mean<br><em>infallible.</em>",sub:"Check important information, understand feature limits, and protect sensitive data.",title:"THREE RULES BEFORE YOU RELY ON AN ANSWER",body:`<div class="limits"><div class="limit reveal"><div class="symbol">01</div><strong>Verify facts</strong><p>AI can make mistakes. Check important claims against reliable sources.</p></div><div class="limit reveal"><div class="symbol">02</div><strong>Check availability</strong><p>Tools and usage limits can vary by plan, account settings, and platform.</p></div><div class="limit reveal"><div class="symbol">03</div><strong>Protect data</strong><p>Think before sharing private or sensitive information in a prompt.</p></div></div>`},
{id:"cta",a:324.78,b:D,k:"NEXT ON SHORTPROMPT",h:"Make your next prompt<br><em>work harder.</em>",sub:"Subscribe for practical AI guides. Next episode: ten ready-to-copy prompts.",title:"THE NEXT EPISODE IS ALREADY PLANNED",body:`<div class="end"><div class="end-copy"><div class="end-brand">SHORT<span>PROMPT</span></div><h2>10 ChatGPT prompts<br>you can copy today.</h2><p>Everyday work • learning • productivity. Subscribe so you do not miss the next guide.</p></div><div class="next-card reveal"><small>COMING NEXT</small><strong>10 READY-TO-COPY<br>CHATGPT PROMPTS</strong><p>One prompt for each practical task. No filler.</p></div></div>`}
];
let active=-1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function render(time){
 const t=clamp(Number(time)||0,0,D);
 let i=S.findIndex((s,n)=>t>=s.a&&(t<s.b||n===S.length-1));if(i<0)i=0;
 const s=S[i],p=clamp((t-s.a)/(s.b-s.a),0,1);
 if(i!==active){
  document.getElementById('eyebrow').textContent=s.k;
  document.getElementById('headline').innerHTML=s.h;
  document.getElementById('sub').textContent=s.sub;
  document.getElementById('stage-title').textContent=s.title;
  document.getElementById('stagebody').innerHTML=s.body;
  document.getElementById('scene-no').textContent=String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  active=i;
 }
 const items=document.querySelectorAll('#sp-chatgpt-guide .reveal');
 items.forEach((el,j)=>{const q=clamp((p-(j*.16))/.34,0,1);el.style.opacity=String(.12+.88*q);el.style.transform=`translateY(${14*(1-q)}px)`;});
 document.getElementById('progress').style.width=(t/D*100)+'%';
}
window.SPMOTION={width:1920,height:1080,fps:30,duration:D};
window.SPMOTION_FRAME=function(time){render(time);};
render(0);
</script>
</body>
</html>
