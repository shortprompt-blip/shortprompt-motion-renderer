<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShortPrompt LLM JSON Formatter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081020;color:#edf3ff;font-family:Inter,system-ui,Arial}#stage{width:1920px;height:1080px;position:relative;background:radial-gradient(ellipse at 80% 5%,#1b3155,transparent 40%),linear-gradient(135deg,#081020,#101c31)}.top{height:72px;padding:0 70px;display:flex;align-items:center;border-bottom:1px solid #293b57;background:#0b1426}.logo{font-size:29px;font-weight:900}.logo span{color:#80b2ff}.nav{margin-left:auto;display:flex;gap:34px;color:#9eb3d1;font-size:18px}.content{position:absolute;top:72px;left:0;right:0;bottom:65px;padding:45px 70px}.k{font-size:19px;letter-spacing:3px;text-transform:uppercase;color:#83b4ff;font-weight:800}h1{font-size:52px;line-height:1.08;letter-spacing:-1.6px;margin:16px 0}.sub{font-size:24px;color:#aec0da;line-height:1.45;max-width:1300px}.panel{background:#111d31;border:1px solid #30425f;border-radius:17px;overflow:hidden;box-shadow:0 18px 45px #0003}.browser{background:#0d1728;height:43px;display:flex;align-items:center;padding:0 18px;gap:8px;border-bottom:1px solid #293b57}.bd{width:10px;height:10px;background:#62738e;border-radius:50%}.url{margin-left:15px;background:#17243a;border:1px solid #30425f;border-radius:6px;padding:6px 16px;color:#a9bddb;width:72%;font-size:15px}.sitehead{padding:17px 24px 10px;display:flex;align-items:center}.sitebrand{font-size:24px;font-weight:900}.sitebrand span{color:#80b2ff}.badge{margin-left:auto;color:#91a7c7;font-size:13px}.intro{padding:0 24px 15px}.intro h2{margin:0 0 5px;font-size:26px}.intro p{margin:0;color:#a3b6d2;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:0 24px}.box{border:1px solid #30425f;border-radius:10px;overflow:hidden;background:#0c1628}.boxhead{background:#15243a;border-bottom:1px solid #293b57;padding:12px 14px;font-weight:750;font-size:16px}.counter{float:right;color:#91a7c7;font-weight:500;font-size:13px}.editor{height:220px;padding:15px;font:16px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;color:#dce8fa}.output{color:#aee9cb}.controls{display:flex;gap:12px;align-items:center;padding:14px 24px}.select,.secondary{border:1px solid #405575;background:#172640;color:#dce8fa;border-radius:8px;padding:10px 13px;font-size:15px}.btn{background:#80b2ff;color:#071426;font-weight:850;border-radius:8px;padding:11px 15px;font-size:15px}.note{margin:0 24px 17px;color:#91a7c7;font-size:14px}.stats{display:flex;gap:16px;margin-top:24px}.stat{padding:17px 23px;border:1px solid #30425f;border-radius:12px;background:#111d31;min-width:210px}.stat strong{display:block;font-size:32px}.stat span{color:#9eb3d1;font-size:15px}.call{margin-top:22px;padding:17px 22px;border:1px solid #27605a;background:#102b2a;border-radius:12px;color:#c5f5e3;font-size:19px;max-width:1150px}.center{height:100%;display:flex;flex-direction:column;justify-content:center}.big{font-size:86px;line-height:1.02;font-weight:950;letter-spacing:-3px}.blue{color:#80b2ff}.green{color:#75e3b8}.orange{color:#ffd080}.cards{display:flex;gap:20px;margin-top:35px}.card{padding:23px 26px;background:#13223a;border:1px solid #30425f;border-radius:14px;min-width:230px}.card b{display:block;font-size:36px}.card span{font-size:17px;color:#9eb3d1}.lower{position:absolute;bottom:26px;left:70px;right:70px;display:flex;align-items:center;gap:20px;color:#8fa4c5;font-size:15px}.bar{height:5px;flex:1;background:#293b57;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#80b2ff}.tag{font-weight:800;letter-spacing:1px}
</style></head><body><div id="stage"><div class="top"><div class="logo">Short<span>Prompt</span></div><div class="nav"><span>AI Tools</span><span>Developer Utilities</span><span>Guides</span><span>Free tools</span></div></div><div class="content" id="content"></div><div class="lower"><span class="tag" id="tag">OPENING</span><div class="bar"><i id="prog"></i></div><span id="clock">00:00 / 04:00</span></div></div>
<script>
const D=240, raw=`Project: Creator Dashboard

Owner: Sample User
Status: In progress

Tasks:
- Fix the mobile layout
- Validate the JSON response
- Update the documentation`, pretty=`{
  "project": "Creator Dashboard",
  "owner": "Sample User",
  "status": "In progress",
  "tasks": [
    "Fix the mobile layout",
    "Validate the JSON response",
    "Update the documentation"
  ]
}`, compact=JSON.stringify(JSON.parse(pretty)), $=s=>document.querySelector(s);
function tool(mode){let input=mode==="raw"?raw:pretty,out=mode==="compact"?compact:pretty;return `<div class="panel" style="margin-top:24px"><div class="browser"><i class="bd"></i><i class="bd"></i><i class="bd"></i><div class="url">shortprompt.altervista.org/llm-json-formatter/</div></div><div class="sitehead"><div class="sitebrand">Short<span>Prompt</span></div><div class="badge">FREE ONLINE TOOL</div></div><div class="intro"><h2>LLM Data &amp; JSON Formatter</h2><p>Convert raw text, unstructured lists, or loose data into clean JSON for AI prompts.</p></div><div class="grid"><div class="box"><div class="boxhead">Raw Text / Data / List <span class="counter">Input Chars: ${input.length}</span></div><div class="editor">${input}</div></div><div class="box"><div class="boxhead">Formatted Output (JSON / Markdown) <span class="counter">Output Chars: ${out.length}</span></div><div class="editor output">${out.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div></div></div><div class="controls"><span style="color:#9eb3d1">Format as:</span><span class="select">${mode==="compact"?"Minified JSON":"JSON"}　⌄</span><span class="btn">${mode==="compact"?"Copy Compact Data":"Copy Formatted Data"}</span><span class="secondary">Clear</span></div><p class="note">Illustrative sample content. Review output before using it in a real workflow.</p></div>`}
function panel(title,body,side){return `<div class="panel" style="margin-top:24px"><div class="boxhead">${title}<span class="counter">${side}</span></div><div class="editor" style="height:310px;font-size:22px">${body}</div></div>`}
function s0(){return `<div class="center"><div class="k">A practical AI workflow</div><div class="big" style="margin-top:24px">Clean up JSON<br><span class="blue">before it reaches</span><br>your AI workflow.</div><p class="sub" style="margin-top:25px">A quick walkthrough of the ShortPrompt LLM Data &amp; JSON Formatter.</p><div class="cards"><div class="card"><b>01</b><span>Paste messy input</span></div><div class="card"><b>02</b><span>Structure the data</span></div><div class="card"><b>03</b><span>Copy and review</span></div></div></div>`}
function s1(){return `<div class="k">The problem</div><h1>Useful information. Messy structure.</h1><p class="sub">Extra formatting and inconsistent notes make data harder to scan and reuse.</p>${panel("Raw project notes",raw,"INPUT")}<div class="call">Goal: preserve every detail while making the structure easier to reuse.</div>`}
function s2(){return `<div class="k">Step 1 · Open the tool</div><h1>One page. Input, output, format.</h1><p class="sub">The ShortPrompt page puts raw data and formatted output side by side.</p>${tool("raw")}`}
function s3(){return `<div class="k">Step 2 · Choose JSON</div><h1>Turn notes into clear fields</h1><p class="sub">Separate the project, owner, status, and task list. Then compare the output with the original input.</p>${tool("result")}<div class="call">Check: all three tasks are present and the status is unchanged.</div>`}
function s4(){return `<div class="k">Step 3 · Compare formats</div><h1>Readable JSON vs. compact JSON</h1><p class="sub">Pretty formatting helps humans inspect the structure. Minified output removes indentation and line breaks.</p><div class="cards"><div class="card" style="flex:1"><b style="font-size:24px">Readable JSON</b><div style="white-space:pre-wrap;font:17px/1.6 monospace;margin-top:15px">${pretty}</div></div><div class="card" style="flex:1"><b style="font-size:24px">Compact JSON</b><div style="font:17px/1.6 monospace;overflow-wrap:anywhere;margin-top:15px">${compact}</div></div></div><div class="stats"><div class="stat"><strong>${pretty.length}</strong><span>Readable characters</span></div><div class="stat"><strong>${compact.length}</strong><span>Compact characters</span></div><div class="stat"><strong>${Math.round((1-compact.length/pretty.length)*100)}%</strong><span>Fewer characters in this sample</span></div></div>`}
function s5(){return `<div class="center"><div class="k">Important distinction</div><div class="big" style="margin-top:20px">Fewer characters<br>doesn’t guarantee<br><span class="orange">fewer tokens.</span></div><p class="sub" style="margin-top:28px;max-width:1280px">Token counts depend on the model’s tokenizer. Removing whitespace may help, but the effect varies. Use the target model’s tokenizer or actual usage data for reliable estimates.</p><div class="cards"><div class="card"><b>Characters</b><span>Exact string length</span></div><div class="card"><b>Tokens</b><span>Model-dependent units</span></div><div class="card"><b>Cost</b><span>Depends on usage and pricing</span></div></div></div>`}
function s6(){return `<div class="k">Step 4 · Copy and review</div><h1>Copy the output. Check it first.</h1><p class="sub">Use the copy control, then paste the structured data into your prompt, editor, or documentation.</p>${tool("compact")}<div class="call">Review correctness and follow your privacy and security rules before using real data.</div>`}
function s7(){return `<div class="center"><div class="k">Try it yourself</div><div class="big" style="margin-top:20px">Clean data.<br><span class="green">Clearer workflow.</span></div><p class="sub" style="margin-top:25px">ShortPrompt LLM Data &amp; JSON Formatter</p><div class="panel" style="margin-top:30px;padding:30px;max-width:1180px"><div style="font-size:24px;color:#a9bddb">Open the tool</div><div style="font-size:35px;font-weight:900;color:#80b2ff;margin-top:12px">shortprompt.altervista.org/llm-json-formatter/</div><div style="font-size:21px;color:#b9cbe4;margin-top:24px">Free to try · Format · Review · Copy</div></div><p class="sub" style="font-size:21px;margin-top:32px">Follow for more practical AI and creator workflow fixes.</p></div>`}
const scenes=[{a:0,b:18,t:"OPENING",f:s0},{a:18,b:43,t:"THE PROBLEM",f:s1},{a:43,b:75,t:"OPEN THE TOOL",f:s2},{a:75,b:116,t:"STRUCTURE THE DATA",f:s3},{a:116,b:151,t:"COMPARE FORMATS",f:s4},{a:151,b:184,t:"TOKEN REALITY CHECK",f:s5},{a:184,b:216,t:"COPY & REVIEW",f:s6},{a:216,b:240,t:"CALL TO ACTION",f:s7}];
function render(t){t=Math.max(0,Math.min(D,t));let s=scenes.find(x=>t>=x.a&&t<x.b)||scenes[7];$("#content").innerHTML=s.f();$("#tag").textContent=s.t;$("#prog").style.width=(100*t/D)+"%";$("#clock").textContent=`${String(Math.floor(t/60)).padStart(2,"0")}:${String(Math.floor(t%60)).padStart(2,"0")} / 04:00`}
window.SPMOTION={width:1920,height:1080,fps:30,duration:D};window.SPMOTION_FRAME=t=>{render(t);return $("#stage")};window.SPMOTION_RENDER=window.SPMOTION_FRAME;render(0);let start=performance.now();function preview(now){if(!window.__SPMOTION_EXPORT)render(((now-start)/1000)%D);requestAnimationFrame(preview)}requestAnimationFrame(preview);
</script></body></html>
