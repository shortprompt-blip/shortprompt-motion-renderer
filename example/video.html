const S=[ {id:'hook',a:0,b:9.585,k:'A NEW CLASS OF TECHNICAL WORK',h:'Claude Fable <em>5.2</em>',l:'Anthropic’s demonstrations move beyond chat: software, hardware, robotics and formal mathematics.',v:'MODEL OVERVIEW',body:`<div class="hook-lockup"><div class="model">FABLE<br><span>5.2</span></div><div class="under">A model built for ambitious, open-ended technical work — with company-reported demonstrations across several disciplines.</div><div class="orbit"><div class="core">F</div><div class="orbit-label">REASON • BUILD • VERIFY</div></div></div>`}, {id:'os',a:9.585,b:26.981,k:'SOFTWARE ENGINEERING',h:'A working OS from an <em>empty folder</em>',l:'Anthropic says more than 1,000 subagents worked around the clock for eight days.',v:'PROTOTYPE OPERATING SYSTEM',body:`<div class="os-shell"><div class="os-bar"><span>FABLE OS / DESKTOP</span><span>BOOTED • LOCAL SESSION</span></div><div class="os-desktop"><div class="os-window"><div class="os-title"><i></i><i></i><i></i><span style="margin-left:9px">system / kernel-status</span></div><div class="os-content"><div class="os-side">▸ Desktop<br>▸ Files<br>▸ Network<br>▸ Settings<br>▸ Installer</div><div class="os-code">$ boot sequence: <b>complete</b><br>kernel ............ running<br>disk driver ....... loaded<br>keyboard driver ... loaded<br>network driver .... loaded<br>persistent store . mounted<br>window manager .... active<br><br><b>Welcome to Fable OS</b><br>System ready.</div></div></div><div class="os-icons"><div><div class="os-icon">▤</div>Files</div><div><div class="os-icon">⌘</div>Network</div><div><div class="os-icon">⚙</div>Setup</div></div><div class="agent-panel"><div class="agent-stats"><b>AGENT COORDINATION</b><span id="agent-count">0 / 1,000+</span></div><div class="agent-grid" id="agent-grid"></div><div class="agent-stats" style="margin-top:12px"><span>8 DAYS • CONTINUOUS WORK</span><span>BUILD / TEST / REVIEW</span></div></div></div></div>`}, {id:'devices',a:26.981,b:39.173,k:'HARDWARE ENGINEERING',h: e="height:26%">26%</div><div class="bar-label">Opus 5.5<br>18 hours</div></div></div><div class="chart-note">The bars show only the published milestones; they are not a reconstructed time-series curve. Anthropic says Opus 5.5 made little further progress by 30 hours.</div></div></div>`}, {id:'close',a:72.232,b:D,k:'WHAT THE EVIDENCE SHOWS',h:'Impressive results. <em>Read the context.</em>',l:'These are Anthropic’s prerelease tests and demonstrations. They are not independent guarantees of general performance.',v:'EVIDENCE CHECK',body:`<div class="final-grid"><div class="final-card"><div><div class="kicker">WHAT WAS SHOWN</div><strong>Concrete outputs</strong></div><div class="big">4×</div><p>Software, electronic prototypes, robot-control tasks and formal mathematics.</p></div><div class="final-card"><div><div class="kicker">WHAT TO REMEMBER</div><strong>Company-reported evidence</strong></div><p>Early prototypes are not commercial products. Benchmark results depend on the stated setup and methodology.</p><div class="disclaimer">Source: Anthropic announcement, 9 November 2026, and its electronics-design report with Diode.</div></div></div>`}];
let activeScene=-1;
let lastAgentCount=-1;
function render(t){
 t=Math.max(0,Math.min(t,D));
 let i=S.findIndex((s,n)=>t>=s.a&&(t<s.b||n===S.length-1));
 if(i<0)i=0;
 const s=S[i];
 const p=Math.max(0,Math.min(1,(t-s.a)/(s.b-s.a)));
 if(i!==activeScene){
  document.getElementById('kicker').textContent=s.k;
  document.getElementById('headline').innerHTML=s.h;
  document.getElementById('lead').textContent=s.l;
  document.getElementById('visual-title').textContent=s.v;
  document.getElementById('visual-body').innerHTML=s.body;
  document.getElementById('section-label').textContent=s.id.toUpperCase();
  document.getElementById('scene-count').textContent=String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  activeScene=i;
  lastAgentCount=-1;
 }
 document.getElementById('progress').style.width=(t/D*100)+'%';
 if(s.id==='os'){
  const count=Math.floor(p*100);
  if(count!==lastAgentCount){
   const grid=document.getElementById('agent-grid');
   if(grid){grid.innerHTML=Array.from({length:100},(_,j)=>`<i class="${j<count?'on':''}"></i>`).join('');document.getElementById('agent-count').textContent=Math.floor(p*1000).toLocaleString('en-US')+'+ / 1,000+';}
   lastAgentCount=count;
  }
 }
}
window.SPMOTION= {width:1080,height:1920,fps:30,duration:D};
window.SPMOTION_FRAME=function(time) {render(time);};
const params=new URLSearchParams(location.search);render(Number(params.get('t')||0));
