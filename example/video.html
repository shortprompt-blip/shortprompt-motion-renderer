<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Analytics — Impressions vs Views</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:radial-gradient(circle at 78% 20%,rgba(255,0,0,.13),transparent 32%),linear-gradient(135deg,#05070b 0%,#0a0e15 52%,#05070b 100%)}.top{height:86px;border-bottom:1px solid #202630;background:rgba(7,9,13,.96);display:flex;align-items:center;padding:0 48px;gap:28px}.logo{font-weight:800;font-size:30px;letter-spacing:-1px}.yt{width:42px;height:30px;border-radius:9px;background:#ff0033;display:grid;place-items:center}.tri{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid white;margin-left:3px}.body{display:flex;height:994px}.side{width:285px;border-right:1px solid #202630;padding:32px 22px;background:#07090d}.nav{padding:15px 18px;border-radius:12px;color:#9ca3af;margin:6px 0;font-size:20px}.nav.active{background:#20242c;color:white}.main{flex:1;padding:42px 55px;position:relative}.crumb{color:#8b95a5;font-size:18px}.title{font-size:42px;font-weight:800;letter-spacing:-1.5px;margin-top:8px}.tabs{display:flex;gap:38px;border-bottom:1px solid #242a34;margin-top:30px}.tab{padding:16px 3px;color:#8f98a7;font-size:18px}.tab.on{color:white;border-bottom:3px solid #ff0033}.card{background:#0e1219;border:1px solid #242b36;border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.metric{font-size:34px;font-weight:800}.label{font-size:15px;color:#8f98a7;margin-top:4px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;margin-top:24px}.big{height:355px}.small{height:355px}.chart{height:235px;position:relative;margin-top:20px}.line{position:absolute;left:0;right:0;bottom:35px;height:2px;background:#202733}.poly{position:absolute;left:0;right:0;bottom:37px;height:180px}.svgline{width:100%;height:100%}.badge{display:inline-flex;padding:7px 11px;border-radius:99px;background:#171d27;color:#cbd5e1;font-size:14px}.diagnostic{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}.diag{min-height:142px;border-radius:15px;border:1px solid #2a313d;padding:18px;background:#0b0f15}.diag b{font-size:19px}.red{color:#ff4d6d}.green{color:#63e6be}.yellow{color:#ffd166}.blue{color:#60a5fa}.arrow{font-size:28px;color:#687385}.overlay{position:absolute;inset:0;background:rgba(2,4,7,.12);pointer-events:none}.center{position:absolute;left:0;right:0;top:0;bottom:0;display:grid;place-items:center;pointer-events:none}.callout{background:rgba(8,11,16,.94);border:1px solid #3a4351;border-radius:22px;padding:30px 38px;box-shadow:0 30px 90px rgba(0,0,0,.55);max-width:900px;text-align:center}.callout h2{font-size:52px;line-height:1.05;margin:0 0 12px;font-weight:900}.callout p{font-size:24px;color:#b8c0cd;margin:0}.water{position:absolute;bottom:24px;right:45px;color:#46505e;font-size:13px}
</style>
</head>
<body>
<div class="stage" id="stage">
<div class="top"><div class="yt"><div class="tri"></div></div><div class="logo">YouTube Studio</div><div style="color:#7f8998;font-size:18px">Analytics</div></div>
<div class="body"><aside class="side"><div class="nav">Dashboard</div><div class="nav">Content</div><div class="nav active">Analytics</div><div class="nav">Community</div><div class="nav">Subtitles</div><div class="nav">Copyright</div><div class="nav">Earn</div><div class="nav">Customization</div></aside>
<main class="main" id="main"></main></div>
<div class="water">Analytics diagnostic • reconstructed interface</div><div class="overlay"></div><div class="center" id="center"></div>
</div>
<script>
const scenes=[
{t:0,e:55,html:`<div class="crumb">Analytics / Video performance</div><div class="title">Why did this video get impressions but no views?</div><div class="tabs"><div class="tab">Overview</div><div class="tab on">Reach</div><div class="tab">Engagement</div><div class="tab">Audience</div></div><div class="grid"><section class="card big"><span class="badge">Impressions</span><div style="display:flex;gap:70px;margin-top:22px"><div><div class="metric">20,000</div><div class="label">Thumbnail impressions</div></div><div><div class="metric">2.1%</div><div class="label">Impressions CTR</div></div><div><div class="metric">420</div><div class="label">Views from impressions</div></div></div><div class="chart"><div class="line"></div><svg class="svgline" viewBox="0 0 900 190" preserveAspectRatio="none"><polyline points="0,160 120,145 220,150 340,110 450,122 560,78 680,91 790,45 900,55" fill="none" stroke="#ff0033" stroke-width="5"/></svg></div></section><section class="card small"><div class="label">Impressions and how they led to watch time</div><div style="margin-top:35px"><div class="metric">20,000</div><div class="label">Impressions</div></div><div style="margin-top:28px;height:12px;border-radius:8px;background:#252c38"><div style="width:21%;height:100%;border-radius:8px;background:#ff0033"></div></div><div style="display:flex;justify-content:space-between;margin-top:14px;color:#9ba4b1"><span>Shown</span><span>Clicked</span></div><div style="margin-top:35px;font-size:20px;color:#cbd5e1">The first question is not “Is the video bad?”</div><div style="margin-top:8px;color:#8f98a7">Find where the funnel breaks.</div></div></section></div>`},
{t:55,e:115,html:`<div class="title">1. Check Impressions</div><div class="grid"><section class="card big"><div class="label">Thumbnail impressions</div><div class="metric" style="font-size:48px;margin-top:15px">20,000</div><div class="chart"><svg class="svgline" viewBox="0 0 900 190" preserveAspectRatio="none"><polyline points="0,165 100,145 210,148 320,112 420,128 540,75 650,90 760,52 900,60" fill="none" stroke="#60a5fa" stroke-width="6"/></svg></div></section><section class="card small"><div class="label">Diagnostic</div><div style="font-size:28px;font-weight:800;margin-top:22px">Low impressions?</div><ul style="font-size:20px;color:#aeb7c5;line-height:1.7;margin-top:22px"><li>Is there enough data?</li><li>Who is the intended audience?</li><li>Where is the traffic coming from?</li><li>Is the topic relevant to this audience?</li></ul></section></div><div class="callout" style="position:absolute;right:75px;bottom:48px;max-width:650px;padding:20px 26px"><h2 style="font-size:30px">Don't diagnose too early.</h2><p style="font-size:18px">Small samples can be misleading.</p></div>`},
{t:115,e:175,html:`<div class="title">2. If impressions are high, check CTR</div><div class="grid"><section class="card big"><div style="display:flex;justify-content:space-between"><span class="label">Impressions</span><span class="label">CTR</span></div><div style="display:flex;justify-content:space-between;margin-top:10px"><div class="metric">20,000</div><div class="metric" style="color:#ff6b7d">2.1%</div></div><div style="margin-top:40px;height:80px;background:#171c24;border-radius:12px;display:flex;align-items:center"><div style="width:21%;height:100%;background:linear-gradient(90deg,#ff0033,#ff4d6d);border-radius:12px"></div></div><div style="margin-top:20px;font-size:21px;color:#cbd5e1">Lots of opportunities to see the video — few become views.</div></section><section class="card small"><div class="label">Packaging</div><div style="font-size:28px;font-weight:800;margin-top:20px">Title + Thumbnail</div><div style="margin-top:22px;font-size:20px;color:#9fa8b6;line-height:1.55">Does the viewer understand the promise immediately?</div><div style="margin-top:28px;padding:18px;border:1px solid #3b4350;border-radius:13px;background:#121721"><b>Not clickbait.</b><br><span style="color:#9ca3af">Make the real value obvious.</span></div></section></div>`},
{t:175,e:235,html:`<div class="title">3. Check where the impressions come from</div><div class="card" style="margin-top:25px"><div class="label">How viewers find this video</div><div style="margin-top:25px;display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="diag"><b>Browse features</b><div style="margin-top:12px;color:#60a5fa;font-size:30px">48%</div></div><div class="diag"><b>YouTube Search</b><div style="margin-top:12px;color:#63e6be;font-size:30px">31%</div></div><div class="diag"><b>Suggested videos</b><div style="margin-top:12px;color:#ffd166;font-size:30px">14%</div></div><div class="diag"><b>External / Other</b><div style="margin-top:12px;color:#a78bfa;font-size:30px">7%</div></div></div></div><div style="margin-top:22px;color:#9da6b4;font-size:19px">CTR must be interpreted in context. The audience seeing a Home impression is different from someone who already knows your channel.</div>`},
{t:235,e:300,html:`<div class="title">4. If viewers click, check retention</div><div class="grid"><section class="card big"><div class="label">Audience retention</div><div class="metric" style="margin-top:12px">38%</div><div class="label">Average percentage viewed</div><div class="chart"><svg class="svgline" viewBox="0 0 900 190" preserveAspectRatio="none"><polyline points="0,30 80,55 150,85 220,98 300,108 410,120 520,135 650,145 760,154 900,162" fill="none" stroke="#ff0033" stroke-width="6"/></svg></div></section><section class="card small"><div class="badge">Example</div><div style="font-size:26px;font-weight:800;margin-top:20px">The click worked.</div><div style="margin-top:15px;color:#9ea7b4;font-size:20px">But the opening did not deliver the promised value quickly enough.</div><div style="margin-top:25px;border-left:4px solid #ff0033;padding-left:18px;font-size:21px">“3 AI tools” → 30 seconds of intro → first tool</div><div style="margin-top:20px;color:#63e6be;font-weight:700">Fix: get to the promise faster.</div></section></div>`},
{t:300,e:365,html:`<div class="title">5. High CTR + good retention can still mean low impressions</div><div class="card" style="margin-top:25px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px"><div class="diag"><b>CTR</b><div style="font-size:36px;color:#63e6be;margin-top:14px">7.8%</div><div class="label">Strong signal</div></div><div class="diag"><b>Retention</b><div style="font-size:36px;color:#63e6be;margin-top:14px">52%</div><div class="label">Healthy example</div></div><div class="diag"><b>Impressions</b><div style="font-size:36px;color:#ffd166;margin-top:14px">1,900</div><div class="label">Still limited</div></div></div><div style="margin-top:32px;font-size:23px;color:#c3cad5">That does not automatically mean the thumbnail is the problem.</div><div style="margin-top:15px;color:#8f98a7;font-size:19px">Consider audience fit, topic demand, competitive context and traffic sources.</div></div>`},
{t:365,e:425,html:`<div class="title">The diagnostic funnel</div><div class="diagnostic"><div class="diag"><b class="blue">1. Impressions</b><p style="color:#9ca5b2">Are there enough opportunities to be seen?</p></div><div class="diag"><b class="red">2. CTR</b><p style="color:#9ca5b2">Do title + thumbnail earn the click?</p></div><div class="diag"><b class="yellow">3. Traffic</b><p style="color:#9ca5b2">Who is actually seeing the video?</p></div><div class="diag"><b class="green">4. Retention</b><p style="color:#9ca5b2">Does the video deliver after the click?</p></div></div><div class="card" style="margin-top:28px"><div style="display:flex;align-items:center;justify-content:space-between;font-size:24px"><span>Impressions</span><span class="arrow">→</span><span>CTR</span><span class="arrow">→</span><span>Views</span><span class="arrow">→</span><span>Watch time</span></div></div>`},
{t:425,e:500,html:`<div class="title">What should you change?</div><div class="card" style="margin-top:25px"><div class="diagnostic"><div class="diag"><b class="red">High impressions<br>+ low CTR</b><p>Work on packaging.</p><p style="color:#8f98a7">Title + thumbnail.</p></div><div class="diag"><b class="yellow">Good CTR<br>+ weak retention</b><p>Work on the opening.</p><p style="color:#8f98a7">Deliver the promise faster.</p></div><div class="diag"><b class="blue">Low impressions<br>+ strong metrics</b><p>Investigate context.</p><p style="color:#8f98a7">Audience, topic, competition.</p></div><div class="diag"><b class="green">Search traffic</b><p>Inspect search terms.</p><p style="color:#8f98a7">Find the real intent.</p></div></div></div><div style="margin-top:28px;color:#9da6b4;font-size:19px">Make one informed change instead of changing everything at once.</div>`},
{t:500,e:560,html:`<div class="title">Stop asking: “Why did my video flop?”</div><div class="callout" style="position:relative;inset:auto;margin:65px auto 0;max-width:1100px"><h2>Ask: “Where does the funnel break?”</h2><p>Impressions → CTR → Views → Retention → Watch time</p></div><div style="display:flex;justify-content:center;gap:22px;margin-top:48px"><span class="badge">Check Impressions</span><span class="badge">Check CTR</span><span class="badge">Check Traffic</span><span class="badge">Check Retention</span><span class="badge">Check Search Terms</span></div>`}
];
function render(t){let s=scenes.find(x=>t>=x.t&&t<x.e)||scenes[scenes.length-1];document.getElementById('main').innerHTML=s.html}
function SPMOTION_FRAME(time){render(time%560)}
window.SPMOTION_FRAME=SPMOTION_FRAME;
window.duration=560;
window.SPMOTION={width:1920,height:1080,fps:30,format:'16:9',mode:'html-autonomous'};
render(0);
</script>
</body></html>
