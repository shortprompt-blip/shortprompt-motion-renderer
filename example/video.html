<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,initial-scale=1"><title>THE 99% QUESTION | ShortPrompt</title><style>
#sp-cpubottleneck{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;box-sizing:border-box;background:#071019;color:#edf5fa;font-family:Inter,Arial,sans-serif;isolation:isolate}
#sp-cpubottleneck *{box-sizing:border-box}#sp-cpubottleneck .bg{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 15%,#244a36 0,transparent 35%),radial-gradient(ellipse at 10% 85%,#14394b 0,transparent 34%),linear-gradient(135deg,#060b12,#10202c 55%,#05090f)}

#sp-cpubottleneck .eyebrow{font-size:17px;color:#9ce96e;font-weight:900;letter-spacing:.18em;margin-bottom:22px}#sp-cpubottleneck h1{font-size:68px;line-height:1.03;letter-spacing:-.045em;margin:0 0 22px;font-weight:950}#sp-cpubottleneck h1 span{color:#95e969}#sp-cpubottleneck .sub{font-size:25px;line-height:1.35;color:#bacbd3}#sp-cpubottleneck .callout{margin-top:24px;padding:16px 18px;border-left:4px solid #8fe65d;background:#14271f;color:#e0ece4;font-size:17px;line-height:1.4}
#sp-cpubottleneck .stage{min-height:610px;border:1px solid #38515e;border-radius:22px;background:linear-gradient(145deg,#142633,#0a151f);box-shadow:0 25px 75px #0008;overflow:hidden}#sp-cpubottleneck .stagebar{height:62px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2e4652;color:#a5b9c3;font-size:14px;font-weight:900;letter-spacing:.12em}#sp-cpubottleneck .stagebody{padding:28px}#sp-cpubottleneck .diagram{height:250px;display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:25px}#sp-cpubottleneck .node{width:30%;min-height:150px;border:1px solid #47616d;border-radius:16px;background:#10212b;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px}#sp-cpubottleneck .node strong{font-size:25px}#sp-cpubottleneck .node small{font-size:13px;color:#9eb4bf;margin-top:12px;letter-spacing:.07em}#sp-cpubottleneck .node.active{border-color:#9ae96c;box-shadow:0 0 25px #80df4a33;background:#1a3325}#sp-cpubottleneck .node.done{border-color:#547d5c;background:#172c20}#sp-cpubottleneck .arrow{font-size:30px;color:#8fe65d;font-weight:900}
#sp-cpubottleneck .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}#sp-cpubottleneck .metric{min-height:118px;padding:17px;border:1px solid #354f5c;border-radius:13px;background:#0c1a23;opacity:.42}#sp-cpubottleneck .metric.revealed{opacity:1;border-color:#739b5b}#sp-cpubottleneck .metric small{display:block;color:#9bb0ba;font-size:12px;letter-spacing:.12em;text-transform:uppercase}#sp-cpubottleneck .metric strong{display:block;margin-top:13px;color:#9ce96e;font-size:22px}#sp-cpubottleneck .caption{margin-top:18px;color:#c5d2d8;font-size:17px;line-height:1.4;min-height:48px}

#sp-cpubottleneck .layout{inset:14% 6% 12%;grid-template-columns:1fr;gap:2%;align-content:center}#sp-cpubottleneck h1{font-size:64px}#sp-cpubottleneck .sub{font-size:26px}#sp-cpubottleneck .stage{min-height:570px}#sp-cpubottleneck .stagebody{padding:22px}#sp-cpubottleneck .diagram{height:220px}#sp-cpubottleneck .node{min-height:130px}#sp-cpubottleneck .top{font-size:14px}#sp-cpubottleneck .foot{font-size:11px}
</style></head><body><div id="sp-cpubottleneck"><div class="bg"></div><div class="grid"></div><div class="top"><div class="brand"><i class="dot"></i>SHORTPROMPT / PC GAMING EXPLAINED</div><div class="pill">CPU vs GPU BOTTLENECK</div></div><div class="layout"><div class="copy"><div class="eyebrow" id="eyebrow"></div><h1 id="headline"></h1><div class="sub" id="sub"></div><div class="callout" id="callout"></div></div><div class="stage"><div class="stagebar"><span id="stage-title"></span><span>ILLUSTRATIVE RECONSTRUCTION</span></div><div class="stagebody"><div class="diagram" id="diagram"></div><div class="metrics" id="metrics"></div><div class="caption" id="caption"></div></div></div></div><div class="foot"><span>SHORTPROMPT • SOURCE-LED EXPLAINER</span><span id="scene-number"></span></div><div class="progress" id="progress"></div></div>
<script>
const D=34.664626;const S=[{"a": 0.0, "b": 11.554875333333333, "e": "THE 99% QUESTION", "h": "GPU at 99%.<br><span>Is that bad?</span>", "sub": "Usually, it means the GPU is busy rendering.", "call": "High GPU utilization can be normal when the GPU is the limit.", "title": "GPU WORKLOAD", "nodes": [["CPU", "SUBMITS"], ["GPU", "BUSY"], ["FRAME", "OUTPUT"]], "metrics": [["GPU LOAD", "99%*"], ["MEANING", "BUSY"], ["AUTOMATIC FAULT", "NO"]], "cap": "*Illustrative reading, not a benchmark."}, {"a": 11.554875333333333, "b": 23.109750666666667, "e": "IS PERFORMANCE OK?", "h": "Look at the<br><span>actual result.</span>", "sub": "If FPS and frame pacing meet your target, no change may be needed.", "call": "Do not chase a utilization number for its own sake.", "title": "EVALUATE", "nodes": [["TARGET", "FPS"], ["CONSISTENCY", "FRAME TIME"], ["EXPERIENCE", "RESULT"]], "metrics": [["MEETS TARGET", "KEEP"], ["BELOW TARGET", "TUNE"], ["NUMBER ALONE", "NO"]], "cap": "The goal is smooth, consistent performance."}, {"a": 23.109750666666667, "b": 34.664626, "e": "IF YOU NEED MORE", "h": "Reduce the<br><span>GPU workload.</span>", "sub": "Try lowering demanding graphics settings.", "call": "Compare frame time and image quality after each change.", "title": "PRACTICAL OPTIONS", "nodes": [["RESOLUTION", "LOWER"], ["RAY TRACING", "TEST"], ["EFFECTS", "TUNE"]], "metrics": [["ONE CHANGE", "YES"], ["RETEST", "YES"], ["UPGRADE?", "LAST"]], "cap": "Follow ShortPrompt for more PC gaming explainers."}];
function render(t){const i=Math.max(0,S.findIndex((s,n)=>t>=s.a&&(t<s.b||n===S.length-1)));const s=S[i];const phase=Math.max(0,Math.min(.999,(t-s.a)/(s.b-s.a)));const active=Math.min(2,Math.floor(phase*3));
document.getElementById('eyebrow').textContent=s.e;document.getElementById('headline').innerHTML=s.h;document.getElementById('sub').textContent=s.sub;document.getElementById('callout').textContent=s.call;document.getElementById('stage-title').textContent=s.title;
document.getElementById('diagram').innerHTML=s.nodes.map((n,j)=>`<div class="node ${j<active?'done':j===active?'active':''}"><strong>${n[0]}</strong><small>${n[1]}</small></div>${j<2?'<div class="arrow">›</div>':''}`).join('');
document.getElementById('metrics').innerHTML=s.metrics.map((m,j)=>`<div class="metric ${phase>=(j+1)*.2?'revealed':''}"><small>${m[0]}</small><strong>${m[1]}</strong></div>`).join('');document.getElementById('caption').textContent=s.cap;document.getElementById('scene-number').textContent=String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');document.getElementById('progress').style.width=(t/D*100)+'%';}
window.SPMOTION={width:1080,height:1920,fps:30,duration:D};window.SPMOTION_FRAME=function(time){render(Math.max(0,Math.min(time,D)));};render(0);
</script></body></html>
