<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Cut Pro Tips for Shorts Creators</title><style>
:root{--bg:#07111f;--cyan:#45f2dc;--green:#9dff70;--yellow:#ffd84a;--muted:#a9bad0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,sans-serif;color:#f7fbff}#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 80% 20%,#173f65 0,transparent 40%),linear-gradient(135deg,#07111f,#0b1729 60%,#07111f)}.grid{position:absolute;inset:0;background-image:linear-gradient(#7bdedc12 1px,transparent 1px),linear-gradient(90deg,#7bdedc12 1px,transparent 1px);background-size:48px 48px}.glow{position:absolute;width:40%;aspect-ratio:1;border-radius:50%;filter:blur(100px);opacity:.18;background:var(--cyan);left:55%;top:28%}.topline{position:absolute;left:6%;right:6%;top:5%;display:flex;justify-content:space-between;font-size:clamp(14px,1.2vw,24px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.brand{color:var(--cyan);font-weight:800}.content{position:absolute;left:7%;right:7%;top:17%;bottom:10%;display:flex;flex-direction:column;justify-content:center;gap:2.2%}.kicker{font-size:clamp(18px,1.7vw,32px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow)}h1{font-size:clamp(54px,8vw,110px);line-height:.98;letter-spacing:-.045em;margin:0;font-weight:900}h1 .accent{color:var(--cyan)}.desc{font-size:clamp(28px,4vw,48px);line-height:1.25;color:#d5e3f4;max-width:94%}.visualrow{display:flex;gap:2%;height:32%;min-height:170px;max-height:420px}.panel{flex:1;min-width:0;border:1px solid #6be8e355;background:linear-gradient(145deg,#152943ef,#0a1728f5);border-radius:24px;padding:2.2%;box-shadow:0 12px 50px #0005;overflow:hidden}.panel h2{margin:0 0 4%;font-size:clamp(18px,2vw,36px);color:var(--cyan)}.panel p{font-size:clamp(14px,1.35vw,25px);line-height:1.25;color:#d9e5f3;margin:2% 0}.footer{position:absolute;bottom:3.2%;left:7%;right:7%;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:clamp(13px,1.1vw,22px)}.progress{height:5px;flex:1;background:#20354b;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--cyan)}.flash{position:absolute;right:7%;top:18%;font-size:clamp(16px,1.6vw,30px);font-weight:900;color:var(--green);border:1px solid #9dff7077;padding:.55em .8em;border-radius:14px;background:#0a231f}@media(max-aspect-ratio:4/5){.topline{top:3.5%}.content{top:13%;bottom:9%;gap:2.5%}.visualrow{height:31%;min-height:0;flex-direction:column}.panel{padding:4%;border-radius:18px}.panel h2{margin-bottom:2%}.panel p{margin:1% 0}.desc{max-width:100%}.footer{bottom:2%}}</style></head><body><div id="stage"><div class="grid"></div><div class="glow" id="glow"></div><div class="topline"><span class="brand">CREATOR FIELD GUIDE</span><span id="chapter"></span></div><div class="content"><div class="kicker" id="kicker"></div><h1 id="headline"></h1><div class="desc" id="desc"></div><div class="visualrow"><div class="panel"><h2 id="at"></h2><div id="ab"></div></div><div class="panel"><h2 id="bt"></h2><div id="bb"></div></div></div></div><div class="flash" id="flash"></div><div class="footer"><span id="counter">01</span><div class="progress"><i id="progress"></i></div><span id="time">00:00</span></div></div><script>
const DURATION=52,SCENES=[{"start": 0, "end": 5, "chapter": "HOOK", "kicker": "FINAL CUT PRO \u2022 CREATOR WORKFLOW", "headline": "EDIT SHORTS<br><span class=\"accent\">FASTER</span>", "desc": "Three practical editing habits for a cleaner, quicker workflow.", "at": "THE GOAL", "ab": "<p>\u2022 Less friction</p><p>\u2022 Clearer story</p><p>\u2022 Better mobile framing</p>", "bt": "3 QUICK WINS", "bb": "<p>01 \u2014 Rough cut</p><p>02 \u2014 Captions</p><p>03 \u2014 Vertical check</p>", "badge": "SAVE TIME"}, {"start": 5, "end": 16, "chapter": "TIP 01 \u2022 ROUGH CUT", "kicker": "TIP 01", "headline": "CUT THE STORY<br><span class=\"accent\">BEFORE EFFECTS</span>", "desc": "Use the Magnetic Timeline to remove pauses and weak takes before polishing.", "at": "BEFORE", "ab": "<p>\u2022 Long pauses</p><p>\u2022 Repeated takes</p><p>\u2022 Slow opening</p>", "bt": "AFTER", "bb": "<p>\u2022 Clear hook</p><p>\u2022 Tighter pacing</p><p>\u2022 Useful moments</p>", "badge": "ROUGH CUT FIRST"}, {"start": 16, "end": 27, "chapter": "TIP 02 \u2022 CAPTIONS", "kicker": "TIP 02", "headline": "MAKE SPEECH<br><span class=\"accent\">EASY TO FOLLOW</span>", "desc": "Add captions, then review accuracy, timing and line breaks.", "at": "CAPTION CHECK", "ab": "<p>\u2022 Correct wording</p><p>\u2022 Readable line length</p><p>\u2022 Synced to speech</p>", "bt": "MOBILE TEST", "bb": "<p>\u2022 Large enough</p><p>\u2022 Strong contrast</p><p>\u2022 Clear of controls</p>", "badge": "CHECK EVERY LINE"}, {"start": 27, "end": 38, "chapter": "TIP 03 \u2022 VERTICAL", "kicker": "TIP 03", "headline": "CHECK YOUR<br><span class=\"accent\">9:16 FRAME</span>", "desc": "Reframe every clip for vertical viewing; do not assume a landscape crop will work.", "at": "WATCH OUT", "ab": "<p>\u2022 Cut-off subjects</p><p>\u2022 Text near edges</p><p>\u2022 Cropped details</p>", "bt": "FINAL CHECK", "bb": "<p>\u2022 Subject in frame</p><p>\u2022 Text in safe area</p><p>\u2022 Preview on phone</p>", "badge": "PREVIEW ON PHONE"}, {"start": 38, "end": 45, "chapter": "WRAP UP", "kicker": "YOUR WORKFLOW", "headline": "STORY FIRST.<br><span class=\"accent\">POLISH SECOND.</span>", "desc": "Rough cut \u2192 captions \u2192 vertical framing \u2192 phone preview.", "at": "EXPORT CHECKLIST", "ab": "<p>\u2713 Tight opening</p><p>\u2713 Accurate captions</p><p>\u2713 Safe framing</p>", "bt": "NEXT STEP", "bb": "<p>Apply one tip today</p><p>Save your checklist</p><p>Follow for more</p>", "badge": "FOLLOW FOR MORE"}];const E=id=>document.getElementById(id);function fmt(t){t=Math.max(0,Math.floor(t));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function render(t){t=Math.max(0,Math.min(DURATION,t));let i=SCENES.findIndex((s,j)=>t>=s.start&&(t<s.end||j===SCENES.length-1));if(i<0)i=0;const s=SCENES[i],p=(t-s.start)/(s.end-s.start),a=Math.min(1,p*5);E('kicker').textContent=s.kicker;E('headline').innerHTML=s.headline;E('desc').textContent=s.desc;E('chapter').textContent=s.chapter;E('at').textContent=s.at;E('ab').innerHTML=s.ab;E('bt').textContent=s.bt;E('bb').innerHTML=s.bb;E('flash').textContent=s.badge||'';['kicker','headline','desc'].forEach((id,j)=>{const delay=[0,.04,.12][j],mult=[5,7,6][j];E(id).style.opacity=Math.min(1,Math.max(0,(p-delay)*mult));E(id).style.transform=`translateY(${(1-a)*(j===1?22:16)}px)`});document.querySelector('.visualrow').style.opacity=Math.min(1,Math.max(0,(p-.18)*6));E('flash').style.opacity=(s.badge&&p>.28&&p<.92)?1:0;E('counter').textContent=String(i+1).padStart(2,'0')+' / '+SCENES.length;E('progress').style.width=(t/DURATION*100)+'%';E('time').textContent=fmt(t);E('glow').style.transform=`translate(${Math.sin(t*.7)*24}px,${Math.cos(t*.45)*20}px) scale(${1+Math.sin(t*.8)*.08})`}window.SPMOTION={width:1080,height:1920,fps:30,duration:DURATION};window.SPMOTION_FRAME=render;window.SPMOTION_RENDER=render;render(0);</script></body></html>
