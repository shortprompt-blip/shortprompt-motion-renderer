<script>
const D=41.903991;
const S=[
{id:"hook",a:0,b:5.5,k:"AI RELIABILITY",h:"Confident…<br><em>but wrong?</em>",sub:"An AI can sound certain and still invent an answer.",title:"CONFIDENCE IS NOT PROOF",body:`<div class="hero"><div class="big">100%<br><span>CONFIDENT?</span></div><div class="line">A convincing answer can still be completely false.</div><div class="stamp">CHECK THE CLAIM</div></div>`},
{id:"question",a:5.5,b:12.5,k:"THE RESEARCH QUESTION",h:"One obscure question.<br><em>Three AI models.</em>",sub:"A 2026 Nature paper reports a simple test: what does PGGB stand for?",title:"THE PGGB TEST",body:`<div class="question"><div class="q-label">PROMPT USED IN THE STUDY</div><div class="q-text">“What does <strong>PGGB</strong> stand for?”</div><div class="modelrow"><div class="model">ChatGPT</div><div class="model">Claude</div><div class="model">DeepSeek</div></div></div>`},
{id:"answers",a:12.5,b:21,k:"WHAT THE PAPER FOUND",h:"All three gave<br><em>an answer.</em>",sub:"Each model produced a specific-sounding definition. The researchers report that all three were wrong.",title:"THREE CONFIDENT ANSWERS",body:`<div class="answers"><div class="answer"><div><small>MODEL 01</small><strong>ChatGPT</strong></div><div class="wrong">INCORRECT</div></div><div class="answer"><div><small>MODEL 02</small><strong>Claude</strong></div><div class="wrong">INCORRECT</div></div><div class="answer"><div><small>MODEL 03</small><strong>DeepSeek</strong></div><div class="wrong">INCORRECT</div></div><div class="allwrong">3 / 3 WRONG</div></div>`},
{id:"incentive",a:21,b:29,k:"WHY IT HAPPENS",h:"The problem can be<br><em>the scoring.</em>",sub:"The study argues that accuracy-only evaluations can reward guessing over admitting uncertainty.",title:"A SIMPLIFIED SCORING EXAMPLE",body:`<div class="incentive"><div class="scale"><div class="choice"><small>MODEL GUESSES</small><strong>Specific answer</strong><div class="score">+1*</div></div><div class="choice muted"><small>MODEL ABSTAINS</small><strong>“I don't know”</strong><div class="score">0*</div></div></div><div class="caption">Illustrative scoring only: the paper explains how ordinary accuracy metrics can favor guesses. The authors propose evaluations that make the cost of wrong answers explicit.</div></div>`},
{id:"lesson",a:29,b:36,k:"THE TAKEAWAY",h:"Fluent doesn't mean<br><em>factual.</em>",sub:"Treat an AI answer as a claim that still needs evidence.",title:"A BETTER WAY TO USE AI",body:`<div class="checklist"><div class="check"><i>✓</i> Ask for reliable sources</div><div class="check"><i>✓</i> Open and verify them</div><div class="check"><i>✓</i> Check the claim independently</div></div>`},
{id:"cta",a:36,b:D,k:"SHORTPROMPT / AI REALITY CHECK",h:"Test the answer.<br><em>Not the confidence.</em>",sub:"Follow ShortPrompt for more real tests of AI.",title:"SOURCE",body:`<div class="end"><div class="logo">SHORT<span>PROMPT</span></div><p>AI experiments. Real evidence. No blind trust.</p><div class="source">Nature, “Evaluating large language models for accuracy incentivizes hallucinations” — 22 April 2026.</div></div>`}
];
let active=-1;
function render(t){
 t=Math.max(0,Math.min(t,D));let i=S.findIndex((s,n)=>t>=s.a&&(t<s.b||n===S.length-1));if(i<0)i=0;const s=S[i],p=Math.max(0,Math.min(1,(t-s.a)/(s.b-s.a)));
 if(i!==active){document.getElementById("eyebrow").textContent=s.k;document.getElementById("headline").innerHTML=s.h;document.getElementById("sub").textContent=s.sub;document.getElementById("stage-title").textContent=s.title;document.getElementById("stagebody").innerHTML=s.body;document.getElementById("tag").textContent=s.id.toUpperCase();document.getElementById("scene-no").textContent=String(i+1).padStart(2,"0")+" / "+String(S.length).padStart(2,"0");active=i;}
 if(s.id==="answers"){document.querySelectorAll("#sp-ai-pggb .answer").forEach((el,j)=>el.classList.toggle("show",p>=(j+1)*.22));}
 if(s.id==="incentive"){document.querySelectorAll("#sp-ai-pggb .choice").forEach((el,j)=>{el.style.transform=p>(j+1)*.24?"translateY(-8px)":"translateY(0)";el.style.borderColor=p>(j+1)*.24?"#91ed69":"#456175";});}
 if(s.id==="lesson"){document.querySelectorAll("#sp-ai-pggb .check").forEach((el,j)=>el.style.opacity=p>(j+1)*.22?"1":".3");}
 document.getElementById("progress").style.width=(t/D*100)+"%";
}
