<style>

8px;color:#66748d;font-size:22px;letter-spacing:6px}.screen{position:absolute;left:95px;right:95px;top:58px;bottom:58px;border-radius:18px;background:linear-gradient(135deg,#081a36,#143b72);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:inset 0 0 35px #0009}.screen b{font-size:52px;letter-spacing:3px}.screen small{font-size:24px;color:var(--cyan);margin-top:20px}.stats{display:flex;gap:22px;width:100%;margin-top:40px}.stat{flex:1;background:#14233b;border:1px solid #2b466b;border-radius:24px;padding:28px;text-align:center}.stat strong{display:block;font-size:58px;color:var(--cyan)}.stat span{font-size:22px;color:var(--muted)}.terminal{width:100%;background:#050a12;border:1px solid #294365;border-radius:26px;padding:34px;font:26px/1.6 ui-monospace,monospace;color:#a7f3cf;box-shadow:0 25px 70px #0008}.terminal .dim{color:#7187a6}.terminal .bright{color:#fff}.barwrap{width:100%;background:#182841;height:24px;border-radius:20px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:20px}.warning{width:100%;padding:34px;border-radius:28px;background:#351d2b;border:2px solid #a44c64;font-size:32px;line-height:1.35}.warning b{color:#ff9aa5}.headphones{width:470px;height:470px;border:34px solid #5b9aff;border-bottom-color:transparent;border-radius:240px 240px 90px 90px;position:relative}.headphones:before,.headphones:after{content:'';position:absolute;bottom:-10px;width:100px;height:180px;border-radius:35px;background:linear-gradient(120deg,#dce6f7,#62718d);box-shadow:0 20px 50px #0008}.headphones:before{left:-55px}.headphones:after{right:-55px}.pill{display:inline-block;margin-top:34px;padding:18px 30px;border-radius:50px;background:#173b69;color:#b9d8ff;font-size:26px;font-weight:700}.footer{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;color:#7788a3;font-size:22px}.progress{position:absolute;bottom:70px;left:0;right:0;h <script>
const W=1080,H=1920,D=52;const $=id=>document.getElementById(id);const scenes=[
{a:0,b:7,e:'THE QUESTION',h:'CAN A PS5\nRUN AI LOCALLY?',s:'A PlayStation console… running its own language model?',v:'console'},
{a:7,b:15,e:'THE PROJECT',h:'MEET PS5LM PLUS',s:'A community homebrew project ports llama.cpp to the PS5 GPU.',v:'terminal'},
{a:15,b:24,e:'THE BENCHMARK',h:'27 BILLION\nPARAMETERS',s:'Developer-reported result: around 20 tokens per second with quantized Qwen 3.8 27B.',v:'stats'},
{a:24,b:32,e:'THE CATCH',h:'NOT A NORMAL PS5',s:'It needs a compatible jailbroken console and homebrew software. Not an official Sony feature.',v:'warning'},
{a:32,b:41,e:'LOCAL SERVER',h:'YOUR PS5. YOUR LAN.',s:'Other devices on the same home network can send prompts to the model running on the console.',v:'network'},
{a:41,b:52,e:'GAMING SETUP',h:'AI EXPERIMENT.\nGAMING UPGRADE.',s:'The LLM does not need a headset. But your gaming setup can still use one.',v:'headphones'}
];
function visual(type,t){if(type==='console')return `<div class="console"><div class="screen"><b>PLAYSTATION 5</b><small>LOCAL AI? / EXPERIMENT</small></div></div>`;if(type==='terminal')return `<div class="terminal"><div class="dim">$ ps5lm-plus --start</div><div class="bright">Loading llama.cpp backend…</div><div>GPU: AMD RDNA 2 / Vulkan</div><div>Model format: GGUF</div><div class="bright">Server ready on local network_</div></div>`;if(type==='stats')return `<div style="width:100%"><div class="stats"><div class="stat"><strong>27B</strong><span>model parameters</span></div><div class="stat"><strong>~20</strong><span>tokens / second</span></div></div><div class="terminal" style="margin-top:28px"><div>Qwen 3.8 27B · quantized</div><div class="barwrap"><div class="bar" style="width:${Math.min(100,Math.max(5,(t-15)/9*100))}%"></div></div><div class="dim" style="margin-top:20px">Developer-reported benchmark</div></div></div>`;if(type==='warning')return `<div class="warning"><b>IMPORTANT LIMITATION</b><br><br>Requires jailbreak + compatible firmware<br><br>Not supported by Sony<br><br>Not available on a standard updated PS5</div>`;if(type==='network')return `<div style="width:100%;text-align:center"><div class="stat" style="width:65%;margin:auto"><strong>PS5</strong><span>LOCAL LLM SERVER</span></div><div style="height:100px;width:3px;background:var(--cyan);margin:auto"></div><div style="display:flex;gap:24px"><div class="stat"><strong>PC</strong><span>Browser chat</span></div><div class="stat"><strong>PHONE</strong><span>Local network</span></div></div><div class="pill">NO CLOUD REQUEST REQUIRED WHILE RUNNING</div></div>`;return `<div style="text-align:center"><div class="headphones"></div><div class="pill">OPTIONAL GAMING ACCESSORY</div></div>`}
function frame(t){t=Math.max(0,Math.min(D,t));let i=scenes.findIndex(x=>t>=x.a&&t<x.b);if(i<0)i=scenes.length-1;let x=scenes[i],p=(t-x.a)/(x.b-x.a);$('eyebrow').textContent=x.e;$('headline').innerHTML=x.h.replace(/\n/g,'<br>');$('sub').textContent=x.s;$('visual').innerHTML=visual(x.v,t);$('counter').textContent=String(i+1).padStart(2,'0')+' / 06';$('progress').style.width=(t/D*100)+'%';$('headline').style.transform=`translateY(${(1-Math.min(1,p*4))*22}px)`;$('headline').style.opacity=Math.min(1,p*5+.05)}
function resize(){let s=Math.min(innerWidth/W,innerHeight/H);$('stage').style.transform=`scale(${s})`;document.body.style.width=innerWidth+'px';document.body.style.height=innerHeight+'px'}window.addEventListener('resize',resize);resize();window.SPMOTION={width:W,height:H,fps:30,duration:D};window.SPMOTION_FRAME=frame;window.SPMOTION_RENDER=frame;let start=performance.now();function preview(){frame(((performance.now()-start)/1000)%D);requestAnimationFrame(preview)}if(!new URLSearchParams(location.search).has('export'))preview();else frame(0);
</script></body></html>
