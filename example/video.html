<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NVIDIA Nemotron 3.5 Lightning Explained in 40 Seconds</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:#f5f8ff;font-family:Arial,sans-serif}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;transform-origin:top left;background:radial-gradient(ellipse at 50% 20%,#14355a,#091326 42%,#050914 80%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#79dfff12 1px,transparent 1px),linear-gradient(90deg,#79dfff12 1px,transparent 1px);background-size:72px 72px}
.brand{position:absolute;top:80px;left:70px;font-size:30px;font-weight:900;letter-spacing:5px;color:#55e6ff}
.counter{position:absolute;top:82px;right:70px;color:#aab6ce;font-size:24px}
.headline{position:absolute;top:210px;left:70px;width:940px;font-size:75px;line-height:1.04;font-weight:900;letter-spacing:-2px}
.headline em{font-style:normal;color:#55e6ff}
.sub{position:absolute;top:465px;left:75px;width:920px;font-size:31px;line-height:1.35;color:#b7c4d9}
.visual{position:absolute;top:680px;left:70px;width:940px;height:520px;border:2px solid #55e6ff88;border-radius:36px;background:linear-gradient(145deg,#10213a,#08111f);box-shadow:0 0 55px #00b7ff22}
.visualTitle{position:absolute;top:35px;left:38px;color:#55e6ff;font-size:25px;font-weight:bold;letter-spacing:4px}
.node{position:absolute;width:210px;padding:23px 8px;text-align:center;border-radius:20px;border:2px solid #ffffff40;background:#17253b;font-size:23px;font-weight:bold}
.n1{left:28px;top:190px}.n2{right:28px;top:190px}.n3{left:365px;bottom:28px}
.core{position:absolute;left:310px;top:150px;width:320px;height:190px;border:3px solid #55e6ff;border-radius:28px;background:#12304b;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;font-weight:900;white-space:pre-line;box-shadow:0 0 45px #00c9ff30}
.info{position:absolute;top:1260px;left:74px;width:930px}
.fact{height:112px;display:flex;align-items:center;gap:28px;margin-bottom:23px;padding:22px 28px;border-radius:22px;background:#0e1b2e;border:1px solid #6eeaff42}
.fact strong{min-width:265px;font-size:40px;color:#a8ff60}.fact span{font-size:29px}
.bottom{position:absolute;left:74px;right:74px;bottom:100px;border-top:2px solid #55e6ff55;padding-top:28px;display:flex;justify-content:space-between;color:#aab6ce;font-size:23px;letter-spacing:2px}
.bottom b{color:#f5f8ff}
</style></head><body><div id="stage"><div class="grid"></div>
<div class="brand">AI MODEL BRIEF</div><div class="counter" id="counter">01 / 04</div>
<div class="headline" id="headline">AI AGENTS NEED MORE THAN A CLEVER ANSWER</div><div class="sub" id="sub">A fast look at what NVIDIA announced — and what it actually means.</div>
<div class="visual" id="visual"><div class="visualTitle">HOW IT FITS</div>
<div class="node n1" id="n1">INPUT</div><div class="node n2" id="n2">CONTEXT</div><div class="core" id="core">NVIDIA<br>AI MODEL</div><div class="node n3" id="n3">OUTPUT</div></div>
<div class="info" id="info">
<div class="fact"><strong>30B</strong><span>parameters</span></div><div class="fact"><strong>MoE</strong><span>architecture</span></div><div class="fact"><strong>AGENTS</strong><span>target workload</span></div>
</div><div class="bottom"><span>AI EXPLAINED · SHORTPROMPT</span><b>FOLLOW FOR MORE →</b></div></div>
<script>
window.SPMOTION={width:1080,height:1920,fps:30,duration:42};
window.SPMOTION_FRAME=function(time){
 const t=Math.max(0,Math.min(42,Number(time)||0));
 const scale=Math.min(window.innerWidth/1080,window.innerHeight/1920);
 document.getElementById('stage').style.transform='scale('+scale+')';
 const scenes=[
  {a:0,b:8,h:'AI AGENTS NEED MORE THAN A CLEVER ANSWER',s:'The headline claim — without the hype.',c:'01 / 04',core:'THE IDEA',one:'PROBLEM',two:'MODEL',three:'RESULT'},
  {a:8,b:18,h:'NVIDIA NEMOTRON 3.5 LIGHTNING',s:'A closer look at the model’s role and design.',c:'02 / 04',core:'HOW IT\nWORKS',one:'INPUT',two:'REASONING',three:'OUTPUT'},
  {a:18,b:30,h:'WHY IT MATTERS',s:'Useful potential, but results depend on the complete system.',c:'03 / 04',core:'BUILD\n& TEST',one:'DATA',two:'MODEL',three:'VALIDATE'},
  {a:30,b:42,h:'WHAT TO REMEMBER',s:'A useful building block — not a magic button or finished product.',c:'04 / 04',core:'REAL-WORLD\nVALIDATION',one:'TASK',two:'EVIDENCE',three:'LIMITS'}
 ];
 let q=scenes[0]; for(const s of scenes){if(t>=s.a&&t<s.b)q=s}
 document.getElementById('headline').textContent=q.h;
 document.getElementById('sub').textContent=q.s;
 document.getElementById('counter').textContent=q.c;
 document.getElementById('core').textContent=q.core;
 document.getElementById('n1').textContent=q.one;
 document.getElementById('n2').textContent=q.two;
 document.getElementById('n3').textContent=q.three;
 document.getElementById('visual').style.transform='translateY('+Math.sin(t*1.1)*8+'px)';
 document.getElementById('core').style.transform='scale('+(1+0.025*Math.sin(t*2))+')';
 document.getElementById('info').style.transform='translateY('+Math.sin(t*.7)*5+'px)';
 document.querySelectorAll('.fact').forEach((f,i)=>{f.style.borderColor=(Math.floor(t/3)%3===i)?'#a8ff60aa':'#6eeaff42'});
};
window.SPMOTION_RENDER=window.SPMOTION_FRAME;
window.SPMOTION_FRAME(0);
window.addEventListener('resize',()=>window.SPMOTION_FRAME(0));
</script></body></html>
