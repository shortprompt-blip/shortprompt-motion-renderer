name: SP-MOTION Real Browser Replay

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Browser replay manifest
        required: true
        default: example/browser-replay.json

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Record real browser navigation
        run: node capture/browser-replay.mjs "${{ inputs.manifest }}" example/assets/browser-replay
      - name: Upload browser replay
        uses: actions/upload-artifact@v4
        with:
          name: sp-motion-real-browser-replay
          path: example/assets/browser-replay/
