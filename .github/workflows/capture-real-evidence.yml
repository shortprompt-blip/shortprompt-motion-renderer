name: Capture real source evidence

on:
  workflow_dispatch:

jobs:
  capture-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: renderer
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Capture REAL source screenshots
        run: node renderer/capture.mjs example

      - name: Embed captures into video.html
        run: node renderer/embed-evidence.mjs example

      - name: Verify evidence
        run: |
          test -s example/assets/evidence/sonnet-official.png
          grep -q 'data:image/png;base64,' example/video.html

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: sp-motion-real-source-evidence
          path: |
            example/assets/evidence/
            example/video.html
