name: SP-MOTION HTML Render

on:
  workflow_dispatch:
    inputs:
      voice:
        description: Kokoro voice
        required: true
        default: af_heart
      speed:
        description: Kokoro speed
        required: true
        default: "1.0"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: renderer/package.json

      - name: Setup Python with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: renderer/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install FFmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install renderer dependencies
        working-directory: renderer
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Install Kokoro dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r renderer/requirements.txt

      - name: Generate voiceover — master clock
        run: |
          python renderer/kokoro_tts.py \
            --text example/speech.txt \
            --voice "${{ inputs.voice }}" \
            --speed "${{ inputs.speed }}" \
            --output speech.wav

      - name: Render HTML
        working-directory: renderer
        run: |
          node render.mjs ../example ./.frames ../visual.webm ../speech.wav

      - name: Mux voiceover
        run: node renderer/mux.mjs visual.webm speech.wav final.webm

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: sp-motion-output
          path: |
            final.webm
