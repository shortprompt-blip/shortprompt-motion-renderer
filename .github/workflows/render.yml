name: SP-MOTION HTML Render

on:
  workflow_dispatch:
    inputs:
      voice:
        description: Kokoro voice
        required: true
        default: af_heart
      speed:
        description: Kokoro speed
        required: true
        default: "1.0"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: renderer/package.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: renderer/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: kokoro-models-${{ runner.os }}-v1
          restore-keys: |
            kokoro-models-${{ runner.os }}-

      - name: Install FFmpeg and espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install renderer dependencies
        working-directory: renderer
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Install Kokoro dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r renderer/requirements.txt
          python -m pip install --force-reinstall "numpy<2" "spacy==3.8.7"
          python -m pip install --no-deps "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Validate Python environment
        run: |
          python -m pip check
          python -c "import numpy, spacy, kokoro; print('NumPy:', numpy.__version__); print('spaCy:', spacy.__version__); print('Kokoro import OK')"
          python -c "import spacy; nlp=spacy.load('en_core_web_sm'); print('spaCy model OK:', nlp.meta['version'])"

      - name: Generate voiceover — master clock
        run: |
          python renderer/kokoro_tts.py \
            --text example/speech.txt \
            --voice "${{ inputs.voice }}" \
            --speed "${{ inputs.speed }}" \
            --output speech.wav

      - name: Render HTML — streamed frames
        working-directory: renderer
        run: |
          node render.mjs ../example ./.frames ../visual.webm ../speech.wav

      - name: Mux voiceover
        run: |
          node renderer/mux.mjs visual.webm speech.wav final.webm

      - name: Validate final media
        run: |
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 final.webm
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 final.webm
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate -of default=noprint_wrappers=1 final.webm

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: sp-motion-output
          path: final.webm
