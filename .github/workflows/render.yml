name: SP-MOTION HTML Render

on:
  workflow_dispatch:
    inputs:
      voice:
        description: Kokoro voice
        required: true
        default: af_heart
      speed:
        description: Kokoro speed
        required: true
        default: "1.0"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: renderer/package.json

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install renderer
        working-directory: renderer
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Render HTML to WebM
        working-directory: renderer
        run: |
          node render.mjs ../example ./.frames ../visual.webm

      - name: Setup Python with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: renderer/requirements.txt

      - name: Cache Kokoro / Hugging Face model files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: kokoro-hf-82m-${{ runner.os }}-${{ hashFiles('renderer/requirements.txt') }}
          restore-keys: |
            kokoro-hf-82m-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Kokoro dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r renderer/requirements.txt
          sudo apt-get install -y espeak-ng

      - name: Generate voiceover
        run: |
          python renderer/kokoro_tts.py             --text example/speech.txt             --voice "${{ inputs.voice }}"             --speed "${{ inputs.speed }}"             --output speech.wav

      - name: Mux voiceover
        run: |
          node renderer/mux.mjs visual.webm speech.wav final.webm

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: sp-motion-output
          path: |
            final.webm
            visual.webm
            speech.wav
